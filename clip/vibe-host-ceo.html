   README của dự án ghi lại ba lần bị nuốt dấu ở chữ ĐẦU CÂU ("Bấm"→"Bậm",

   Văn phong theo ghi chú riêng của VH-03: giữ ngôi thứ hai, BỎ hết tiểu từ
   cuối câu (nhé / nè / luôn) và bỏ lời chúc — nói với giám đốc thì điềm đạm.

   KHÔNG DÙNG CHỮ "BẢNG" TRONG LỜI ĐỌC — chỗ này đã sửa sau khi nghe lại bản
   giao. Giọng đang dùng KHÔNG phân biệt được dấu hỏi với dấu huyền: cho đọc
   cặp tối thiểu "Đây là bảng số." / "Đây là bằng số." ở bốn mức stability
   (0.32 / 0.50 / 0.65 / 0.85) thì âm tiết thứ ba ra CÙNG một đường cao độ ở cả

    e.style.width=px((x1-x0)*KX); e.style.height=px((y1-y0)*KY);
    e.style.background=mau;
    c.kb.appendChild(e);

});

  const [x0,y0,x1,y1]=box;
  e.style.left=px(x0*KX); e.style.top=px(y0*KY);
  e.style.width=px((x1-x0)*KX); e.style.height=px((y1-y0)*KY);
}

       chỉ chiếm 159px ảnh). Để nguyên bề ngang thì chuỗi mới đâm vào cái biểu
       tượng "mở ra" bên phải ô; hạ cỡ chữ xuống cho vừa thì lại thấp hơn hẳn
       chữ cũ. Bóp ngang giữ đúng chiều CAO mà vẫn vừa bề ngang. */
    t.style.cssText='font-family:"Be Vietnam Pro",system-ui,sans-serif;white-space:nowrap;'
      +'font-size:'+(L.co*KX).toFixed(2)+'px;color:'+L.mauChu+';letter-spacing:-.01em;'
      +'padding-left:'+(6*KX).toFixed(2)+'px;display:inline-block;transform-origin:left center;'
      +'transform:scaleX('+(L.nen||1)+')';
    e.appendChild(t);
  }
  if(L.k==='ma'){
    /* Ô soạn thảo dựng lại. Nền trắng đè trọn khung mã cũ, rồi in lại 41 dòng
       — cột số dòng và cột mã đặt theo toạ độ đo trên ảnh gốc. */
    /* Nền trắng đè trọn khung mã cũ và ĐỨNG YÊN suốt cảnh — nếu để chính nó
       bị cắt thì trước lúc dán, đoạn mã portfolio in trong ảnh lại hiện ra. Chỉ
       lớp chữ bên trong mới bị cắt dần để thành động tác "dán vào". */
    e.style.background='#ffffff';
    e.style.overflow='hidden';
    const trong=el('div'); trong.style.cssText='position:absolute;inset:0';
    e.appendChild(trong); L.trong=trong;
    const D=16.1, Y0=676-L.box[1];             /* giãn dòng và mốc dòng 1, theo ảnh */
    MA_HTML.forEach(([sau,ma],i)=>{
      const r=el('div');
      r.style.cssText='position:absolute;left:0;right:0;top:'+((Y0+i*D-8)*KY).toFixed(2)+'px;'
        +'height:'+(D*KY).toFixed(2)+'px;font-family:"JetBrains Mono",ui-monospace,monospace;'
        +'font-size:'+(10.3*KX).toFixed(2)+'px;line-height:'+(D*KY).toFixed(2)+'px;white-space:pre;'
        /* Phải đặt màu chữ: phần không được tô cú pháp (nội dung giữa hai thẻ,
           ví dụ "Báo cáo kinh doanh") sẽ thừa kế màu của body — mà body màu
           TRẮNG, nên trên nền khung mã trắng là mất hút. */
        +'color:#3a3f4c';
      const n=el('span',null,String(i+1));
      n.style.cssText='position:absolute;left:'+((248-L.box[0])*KX).toFixed(2)+'px;'
        +'width:'+(20*KX).toFixed(2)+'px;text-align:right;color:#c9ccd6';
      const c=el('span',null,to(ma));
      c.style.cssText='position:absolute;left:'+((276-L.box[0]+sau*7.4)*KX).toFixed(2)+'px;';
      r.appendChild(n); r.appendChild(c); trong.appendChild(r);
    });
  }
  if(L.k==='sang'){
    e.style.background='radial-gradient(closest-side,rgba(150,255,170,.20),rgba(150,255,170,.07) 55%,transparent 78%)';
  }
  const c=SC[L.sc]; c.kb.appendChild(e);
  L.el=e;
});

/* Tô màu cú pháp cho khung mã dựng lại.

   Quét MỘT LƯỢT ra từng mẩu (chữ, màu) rồi mới bọc thẻ — không dùng regex thay
   thẳng trên chuỗi đã bọc, vì luật sau sẽ ăn vào thuộc tính `style=` của thẻ do
   luật trước vừa chèn, đẩy nguyên đoạn CSS ra thành chữ hiện trên màn hình.
   Màu lấy theo bảng màu đọc được trên ảnh gốc: thẻ chàm, thuộc tính xanh,
   chuỗi/giá trị đỏ. */
/* Khai bằng `function` chứ không phải `const`: to() được gọi lúc dựng lớp, tức
   TRƯỚC chỗ này trong file — `const` thì còn trong vùng chết, gọi là ném lỗi
   và cả trang đứng máy. */
function ESC(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
function to(s){
  const out=[];
  const day=(txt,mau)=>{ if(txt) out.push(mau?'<i style="font-style:normal;color:'+mau+'">'+ESC(txt)+'</i>':ESC(txt)) };
  let m;
  if((m=s.match(/^(\s*)([a-z-]+)(:\s*)(.+?)(;\s*)$/))){          /* khai báo CSS */
    day(m[1]); day(m[2],'#5a6072'); day(m[3]); day(m[4],'#d6455c'); day(m[5]);
  }else if((m=s.match(/^(\s*)([.#*][\w-]*|[a-z][\w-]*)(\s*\{\s*)$/))){   /* bộ chọn CSS */
    day(m[1]); day(m[2],'#3b6fd4'); day(m[3]);
  }else if(/^\s*\}\s*$/.test(s)){
    day(s);
  }else{
    let i=0;
    while(i<s.length){
      if(s[i]!=='<'){ const n=s.indexOf('<',i); const e=n<0?s.length:n; day(s.slice(i,e)); i=e; continue }
      let j=i+1; if(s[j]==='/')j++; if(s[j]==='!')j++;
      let k=j; while(k<s.length && /[\w-]/.test(s[k])) k++;
      day(s.slice(i,k),'#4b4b8f'); i=k;
      while(i<s.length && s[i]!=='>'){
        if(/[a-zA-Z]/.test(s[i])){
          let a=i; while(a<s.length && /[\w-]/.test(s[a])) a++;
          day(s.slice(i,a), s[a]==='='?'#3b6fd4':null); i=a;
        }else if(s[i]==='"'||s[i]==="'"){
          let q=s.indexOf(s[i],i+1); if(q<0)q=s.length-1;
          day(s.slice(i,q+1),'#d6455c'); i=q+1;
        }else{ day(s[i]); i++ }
      }
      if(i<s.length){ day('>','#4b4b8f'); i++ }
    }
  }
  return out.join('');
}

/* ==========================================================================
   MÁY QUAY — nhận khung ngắm theo toạ độ ảnh, tự tính phóng và dời
   ========================================================================== */
function ngam(v){
  const [x0,y0,x1,y1]=v;
  const w=(x1-x0)*KX, h=(y1-y0)*KY;
  const s=Math.min(ST_W/w, ST_H/h);          /* vừa khít, không cắt mất mép */
  const cx=(x0+x1)/2*KX, cy=(y0+y1)/2*KY;
  return {s, tx:ST_W/2-s*cx, ty:ST_H/2-s*cy};
}
function trung(a,b,k){
  return [lerp(a[0],b[0],k),lerp(a[1],b[1],k),lerp(a[2],b[2],k),lerp(a[3],b[3],k)];
}

/* ==========================================================================
   PHỤ ĐỀ — mốc lấy từ vị trí thật của tiếng, do bộ lồng tiếng ghi ra
   ========================================================================== */
let PD=VO.map((v,i,a)=>({tu:v[0], den:(a[i+1]?a[i+1][0]:DUR)-0.05, loi:v[1]}));
async function napPhuDe(){
  try{
    const r=await fetch('out/voiceover/phu-de-vibe-host-ceo.json',{cache:'no-store'});
    if(r.ok){const j=await r.json(); if(Array.isArray(j)&&j.length)PD=j}
  }catch(e){}
}
let pdI=-1;

const E={nen:$('#nen'),khoi:$('#khoi'),gach:$('#gach'),c1:$('#c1'),c2:$('#c2'),pd:$('#pd')};
let chuI=-1;
const HOA=0.42;                              /* thời gian chuyển cảnh */

function render(t){
  SC.forEach((s,i)=>{
    const vao=seg(t,s.a-(i?HOA:0),s.a-(i?HOA:0)+HOA,eIO);
    const ra=i===SC.length-1?0:seg(t,s.b-HOA,s.b,eIO);
    const o=i===0?1-ra:vao*(1-ra);
    setO(s.el,o);
    if(o<0.002)return;
    /* Mặc định máy quay đi đều suốt cảnh. Cảnh nào khai `mA`/`mB` thì GIỮ YÊN
       ở v0 tới mA rồi mới đi — cần cho S05.2: hai dải IP phải hiện lúc khung
       còn đứng bên trái, đi sớm là dòng `192.168.10.0/24` bị xén mất phần đầu. */
    const k=eIO(s.mA!=null ? tt(t,s.mA,s.mB) : tt(t,s.a-HOA,s.b));
    const c=ngam(trung(s.v0,s.v1,k));
    s.kb.style.transform='translate('+px(c.tx)+','+px(c.ty)+') scale('+c.s.toFixed(4)+')';
  });

  /* lớp vẽ đè */
  LOP.forEach(L=>{
    if(L.k==='che'){
      /* Hé nội dung từ TRÁI sang phải: miếng che co dần về mép phải, để lộ đúng
         những điểm ảnh có sẵn của ảnh gốc — khớp phông chữ tuyệt đối, hơn hẳn
         gõ lại bằng chữ của trang. */
      const q=1-tt(t,L.a,L.b);
      L.el.style.transform='scaleX('+q.toFixed(4)+')';
      setO(L.el, t>L.b+0.25?0:1);
      return;
    }
    if(L.k==='cheD'||L.k==='ma'){
      /* Co dọc LÊN TRÊN: cột biểu đồ mọc từ vạch đáy, hoặc mã HTML "được dán"
         hiện dần. Cùng một phép, chỉ khác gốc biến đổi đặt ở cạnh trên. */
      const q=1-tt(t,L.a,L.b);
      if(L.k==='ma'){
        /* Mã HIỆN dần từ trên xuống, cắt chứ không co — co thì chữ bị bóp méo. */
        L.trong.style.clipPath='inset(0 0 '+((1-tt(t,L.a,L.b))*100).toFixed(2)+'% 0)';
        setO(L.el,1);
        return;
      }
      L.el.style.transform='scaleY('+q.toFixed(4)+')';
      setO(L.el, t>L.b+0.25?0:1);
      return;
    }
    if(L.k==='cheU'){
      /* Co dọc XUỐNG DƯỚI: bảng hiện dần từ trên xuống (động tác "dán vào"). */
      const q=1-tt(t,L.a,L.b);
      L.el.style.transform='scaleY('+q.toFixed(4)+')';
      setO(L.el, t>L.b+0.25?0:1);
      return;
    }
    if(L.k==='mo'){
      /* Miếng phủ mờ đi để thẻ / dòng / dấu tick hiện ra. */
      setO(L.el, t<L.a?1:(t>L.b?0:1-eIO(tt(t,L.a,L.b))));
      return;
    }
    if(L.k==='chu'){ setO(L.el,1); return }   /* miếng vá chữ: luôn hiện */
    if(L.k==='sang'){
      /* Quầng sáng thở của outro — chậm và rất nhẹ, đúng tinh thần §8. */
      const k=(t-L.a)/2.6;
      setO(L.el, cl(seg(t,L.a,L.a+1.0,eOut)*(0.55+0.45*(0.5+0.5*Math.sin(k*Math.PI))),0,1));
      return;
    }
    setO(L.el, pop(t,L.a,L.b,.24,.28));       /* vong */
  });

  /* chữ tiêu đề */
  let ci=-1;
  CHU.forEach(([a,b],i)=>{ if(b>a && t>=a-0.12 && t<=b+0.12) ci=i });
  if(ci!==chuI){
    chuI=ci;
    if(ci>=0){ E.c1.innerHTML=SC[ci].c1; E.c2.innerHTML=SC[ci].c2 }
  }
  if(ci<0){ setO(E.khoi,0); setO(E.nen,0) }
  else{
    const [a,b]=CHU[ci];
    const v=seg(t,a,a+0.42,eOut), r=seg(t,b-0.34,b,eIn);
    const o=v*(1-r);
    setO(E.khoi,o); setO(E.nen,o*0.98);
    E.gach.style.transform='scaleX('+seg(t,a,a+0.5,eOut).toFixed(3)+')';
    E.gach.style.transformOrigin='left center';
    E.c1.style.transform='translateY('+px((1-v)*26+r*-12)+')';
    E.c2.style.transform='translateY('+px((1-seg(t,a+0.10,a+0.62,eOut))*20+r*-9)+')';
  }

  /* phụ đề */
  {
    const i=PD.findIndex(c=>t>=c.tu-0.12 && t<=c.den+0.18);
    if(i!==pdI){ pdI=i; if(i>=0)E.pd.firstElementChild.innerHTML=PD[i].loi }
    setO(E.pd, i<0?0:pop(t,PD[i].tu-0.12,PD[i].den+0.18,.14,.16));
  }
}

/* ==========================================================================
   CHẠY / TUA
   ========================================================================== */
const TOC=Math.max(0.25,Math.min(4,parseFloat(new URLSearchParams(location.search).get('toc'))||1));
let t=0,DUNG=true,last=0;
function loop(now){
  if(!DUNG){
    t+=Math.min(0.30,(now-last)/1000)*TOC;
    if(t>=DUR){t=DUR;DUNG=true;$('#btnPlay').textContent='▶ Chạy'}
    render(t);ui();
  }
  last=now;requestAnimationFrame(loop);
}
function ui(){$('#scrub').value=t.toFixed(2);
  $('#tnum').textContent=t.toFixed(2)+' / '+DUR.toFixed(2)+'s'}
$('#btnPlay').addEventListener('click',()=>{
  if(t>=DUR)t=0; DUNG=!DUNG; last=performance.now();
  $('#btnPlay').textContent=DUNG?'▶ Chạy':'❚❚ Dừng'});
$('#scrub').addEventListener('input',e=>{t=parseFloat(e.target.value);render(t);ui()});
SC.forEach(s=>{const b=document.createElement('button');
  b.textContent=s.a+'s · '+s.ten; b.onclick=()=>{t=s.a;render(t);ui()};$('#chaps').appendChild(b)});

function fit(){
  if(document.body.classList.contains('exporting')){$('#stage').style.transform='none';return}
  const k=Math.min((innerWidth-40)/ST_W,(innerHeight-160)/ST_H,1);
  $('#stage').style.transform='scale('+k+')';
  $('#stage').style.margin='0 0 '+((k-1)*ST_H)+'px';
}
addEventListener('resize',fit);
function khoiDong(){render(0);ui()}

if(/[?&]export=1/.test(location.search)){
  document.body.classList.add('exporting');
  window.__clip={
    duration:DUR/TOC,
    ready:async()=>{
      await napPhuDe();
      await document.fonts.ready;
      await Promise.all([...document.images].filter(i=>i.src).map(i=>i.decode().catch(()=>{})));
      await new Promise(r=>setTimeout(r,260));
      fit();khoiDong();
    },
    play:()=>{DUNG=false;last=performance.now()},
    at:()=>t/TOC, seek:s=>{t=cl(s*TOC,0,DUR);render(t)}, step:s=>{t=cl(s*TOC,0,DUR);render(t)},
  };
}
fit();
napPhuDe().then(()=>document.fonts.ready).then(khoiDong);
requestAnimationFrame(loop);
})();
</script>
