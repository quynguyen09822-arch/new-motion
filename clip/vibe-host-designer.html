   Ba luật rút ra từ VH-03, áp ngay từ đầu ở bản này thay vì sửa sau khi nghe:

   1. TRÁNH CHỮ CÓ CẶP TỐI THIỂU DẤU HỎI / DẤU HUYỀN. Giọng đang dùng không phân
      biệt được hai dấu đó (đã chứng minh bằng cặp "bảng số" / "bằng số" ở bốn
      mức stability, ra cùng một đường cao độ). Lẫn dấu chỉ thành lỗi khi có từ
      khác tranh chỗ — nên ở bản này gọi là "phiên bản cũ" chứ không gọi trống
      là "bản cũ" ("bản" ↔ "bàn" ↔ "bán" đều là từ thông dụng).

   2. CHỮ MANG DẤU KHÔNG ĐỨNG ÁP CHÓT TRƯỚC DẤU PHẨY — chỗ đó bị nuốt thanh
      điệu (đo được một chữ dấu sắc tụt còn 88-132 Hz). Kết vế bằng chữ không
      dấu hoặc dấu huyền / dấu nặng.

   3. CHỮ ĐẦU CÂU nên KHÔNG DẤU. README ghi ba lần bị nuốt dấu ở đầu câu
      ("Bấm"→"Bậm", "Nối"→"Nội", "Tạo"→"Tao"). Nên các câu ở đây mở bằng "Làm",
      "Khách", "Bây giờ", "Ai", "Còn", "Khi", "Thì", "Không", "Xong", "Trên",
      "Bao nhiêu" — toàn chữ ngang hoặc huyền.

   Kiểm sau khi sinh: chép lại track bằng scribe_v1 (có logprob từng chữ) rồi
   đo dấu bằng tools/do-thanh-dieu.py. Không tin tai máy nhận dạng về DẤU, chỉ
   tin nó về CHỮ.
   ========================================================================== */
const VO=[
  /* Mốc đặt theo ĐỘ DÀI THẬT của tiếng sau lượt sinh đầu, không đặt bằng cảm
     tính — bài học VH-03: đặt bằng cảm tính thì bảy câu bị ép nhịp, mà ép là
     nghe ra ngay giọng chạy. Nhịp nghỉ cũng phân loại: hết câu 0,32-0,35s, còn
     dở câu (kết bằng dấu phẩy) 0,20-0,25s. */
  [ 0.30,'Làm designer, bạn muốn gửi khách một đường link thế này,'],
  [ 3.67,'thay vì phải gửi một file nén?'],
  [ 6.13,'Khách không phải tải về rồi giải nén nữa,'],
  [ 8.46,'mở ra không sợ sai font hay lệch bố cục.'],
  [11.95,'Bây giờ bạn kéo cả file nén lên Vibe Host.'],
  [15.55,'Đặt cái tên rồi bấm xuất bản.'],
  [17.75,'Vài phút là xong.'],
  /* "tên miền riêng" bị đọc thành "tên MIỄN riêng" — dấu huyền bật thành dấu ngã.
     Scribe chép ĐÚNG chữ nên không bắt được, phải đo cao độ: đặt cuối câu thì
     "miền" ngước từ 167 lên 302 Hz, trong khi dấu huyền phải tụt. Thử bốn chỗ
     đặt, chọn chỗ này vì đo được 123-128 Hz phẳng và thấp — đúng dấu huyền. */
  [19.40,'Ai đã mua tên miền thì đưa vào đây luôn.'],
  [22.37,'Còn khoá bảo mật thì hệ thống tự cấp rồi tự gia hạn,'],
  [26.00,'bạn không phải đụng vào.'],
  [28.40,'Khi khách đổi ý, muốn quay về phiên bản cũ?'],
  [31.92,'Thì chọn phiên bản đó, bấm khôi phục là xong.'],
  [35.83,'Không phải làm lại từ đầu nữa đâu.'],
  [39.80,'Xong rồi, khách chỉ việc bấm vào là thấy.'],
  [43.54,'Trên điện thoại hay máy tính đều đúng y như vậy.'],
  /* Dừng lời đọc ở đây, KHÔNG có câu chốt thương hiệu như VH-02/VH-03. Lý do:
     outro của bản này là video brand có tiếng nói riêng bằng hình — đã ghi sẵn
     "Vibe Host · TRIỂN KHAI WEBSITE NHANH & DỄ DÀNG" — nên đọc thêm một câu
     cùng nội dung ngay trước đó là nói hai lần. Sáu giây outro chạy sạch tiếng. */
  [46.91,'Bao nhiêu tác phẩm cũng lên mạng trong vài phút.'],
];

/* ---------- NẮN CHỮ CHO MÁY ĐỌC ----------
   [chữ trong VO, cách đọc]. long-tieng.mjs chỉ thay khi GỬI cho máy đọc — chữ
   trên phụ đề giữ nguyên. Nghe thấy chữ nào sai thì thêm một dòng vào đây, đừng
   viết méo chữ trong VO[]. */
const PHIEN_AM=[
  /* Để mộc, chữ "Vibe" bị nuốt luôn vào "file nén" đứng trước: chép mù 3/3 lần
     ra "Filehost" — mất hẳn tên sản phẩm. "Vai-bơ" thì 3/3 lần ra "ViperHost",
     tức máy nhả đúng âm /vai-bơ hâu-st/. Cùng cách viết trang map-domain đã chốt
     (bên đó thử 7 lượt), giữ cho cả bộ đọc tên thương hiệu giống nhau. */
  ['Vibe Host','Vai-bơ Host'],
  /* Để mộc thì "sai font" bị chép lại thành "siphon" — mất hẳn chữ. Thử ba kiểu
     trong đúng ngữ cảnh của dây chuyền:
       font        → nghe "siphon"      ✗
       phông       → nghe "sai phông"   ✅
       phông chữ   → nghe "phong chủ"   ✗ (rụng cả hai dấu)
     "phông" cũng đúng cách dân thiết kế Việt vẫn đọc. Chữ trên phụ đề giữ "font"
     theo kịch bản. */
  ['font','phông'],
];

/* ==========================================================================
   DỰNG CẢNH
   ========================================================================== */
/* Vài khung ngắm cố ý vượt quá mép ảnh (S02 và S07 chạm đáy tấm), nên phần ngoài
   ảnh phải tô ĐÚNG màu nền tấm đó — để trắng tinh là khung hình chia hai mảng. */
const NEN_TAM=['#fefefe','#fefefe','#fcfcfc','#fcfcfc','#fdfdfd','#f8f8f9','#fffeff'];
const stage=$('#stage');
stage.style.width=ST_W+'px'; stage.style.height=ST_H+'px';

const truoc=$('#nen');
SC.forEach(s=>{
  const sc=el('div','sc'), kb=el('div','kb');
  const im=el('img'); im.src=MK+ANH[s.src]; im.alt='';
  im.style.width=NEN_W+'px'; im.style.height=NEN_H+'px';
  kb.appendChild(im); sc.appendChild(kb);
  sc.style.background=NEN_TAM[s.src];
  stage.insertBefore(sc,truoc);
  s.el=sc; s.kb=kb;
});

LOP.forEach(L=>{
  const e=el('div', L.k==='vong'?'vong':'che');
  const [x0,y0,x1,y1]=L.box;
  e.style.left=px(x0*KX); e.style.top=px(y0*KY);
  e.style.width=px((x1-x0)*KX); e.style.height=px((y1-y0)*KY);
  if(L.k==='che'){ e.style.background=L.mau; e.style.transformOrigin='right center' }
  if(L.k==='mo'){ e.style.background=L.mau }
  SC[L.sc].kb.appendChild(e);
  L.el=e;
});

/* ==========================================================================
   MÁY QUAY — nhận khung ngắm theo toạ độ ảnh, tự tính phóng và dời
   ========================================================================== */
function ngam(v){
  const [x0,y0,x1,y1]=v;
  const w=(x1-x0)*KX, h=(y1-y0)*KY;
  const s=Math.min(ST_W/w, ST_H/h);
  const cx=(x0+x1)/2*KX, cy=(y0+y1)/2*KY;
  return {s, tx:ST_W/2-s*cx, ty:ST_H/2-s*cy};
}
const trung=(a,b,k)=>[lerp(a[0],b[0],k),lerp(a[1],b[1],k),lerp(a[2],b[2],k),lerp(a[3],b[3],k)];

/* ==========================================================================
   PHỤ ĐỀ — mốc lấy từ vị trí thật của tiếng, do bộ lồng tiếng ghi ra
   ========================================================================== */
let PD=VO.map((v,i,a)=>({tu:v[0], den:(a[i+1]?a[i+1][0]:DUR)-0.05, loi:v[1]}));
async function napPhuDe(){
  try{
    const r=await fetch('out/voiceover/phu-de-vibe-host-designer.json',{cache:'no-store'});
    if(r.ok){const j=await r.json(); if(Array.isArray(j)&&j.length)PD=j}
  }catch(e){}
}
let pdI=-1;

const E={nen:$('#nen'),khoi:$('#khoi'),gach:$('#gach'),c1:$('#c1'),c2:$('#c2'),pd:$('#pd')};
let chuI=-1;
const HOA=0.42;

function render(t){
  SC.forEach((s,i)=>{
    const vao=seg(t,s.a-(i?HOA:0),s.a-(i?HOA:0)+HOA,eIO);
    const ra=i===SC.length-1?0:seg(t,s.b-HOA,s.b,eIO);
    const o=i===0?1-ra:vao*(1-ra);
    setO(s.el,o);
    if(o<0.002)return;
    const k=eIO(s.mA!=null ? tt(t,s.mA,s.mB) : tt(t,s.a-HOA,s.b));
    const c=ngam(trung(s.v0,s.v1,k));
    s.kb.style.transform='translate('+px(c.tx)+','+px(c.ty)+') scale('+c.s.toFixed(4)+')';
  });

  LOP.forEach(L=>{
    if(L.k==='che'){
      const q=1-tt(t,L.a,L.b);
      L.el.style.transform='scaleX('+q.toFixed(4)+')';
      setO(L.el, t>L.b+0.25?0:1);
      return;
    }
    if(L.k==='mo'){
      setO(L.el, t<L.a?1:(t>L.b?0:1-eIO(tt(t,L.a,L.b))));
      return;
    }
    setO(L.el, pop(t,L.a,L.b,.24,.28));       /* vong */
  });

  let ci=-1;
  CHU.forEach(([a,b],i)=>{ if(b>a && t>=a-0.12 && t<=b+0.12) ci=i });
  if(ci!==chuI){ chuI=ci; if(ci>=0){ E.c1.innerHTML=SC[ci].c1; E.c2.innerHTML=SC[ci].c2 } }
  if(ci<0){ setO(E.khoi,0); setO(E.nen,0) }
  else{
    const [a,b]=CHU[ci];
    const v=seg(t,a,a+0.42,eOut), r=seg(t,b-0.34,b,eIn);
    const o=v*(1-r);
    setO(E.khoi,o); setO(E.nen,o*0.98);
    E.gach.style.transform='scaleX('+seg(t,a,a+0.5,eOut).toFixed(3)+')';
    E.gach.style.transformOrigin='left center';
    E.c1.style.transform='translateY('+px((1-v)*26+r*-12)+')';
    E.c2.style.transform='translateY('+px((1-seg(t,a+0.10,a+0.62,eOut))*20+r*-9)+')';
  }

  {
    const i=PD.findIndex(c=>t>=c.tu-0.12 && t<=c.den+0.18);
    if(i!==pdI){ pdI=i; if(i>=0)E.pd.firstElementChild.innerHTML=PD[i].loi }
    setO(E.pd, i<0?0:pop(t,PD[i].tu-0.12,PD[i].den+0.18,.14,.16));
  }
}

/* ==========================================================================
   CHẠY / TUA
   ========================================================================== */
const TOC=Math.max(0.25,Math.min(4,parseFloat(new URLSearchParams(location.search).get('toc'))||1));
let t=0,DUNG=true,last=0;
function loop(now){
  if(!DUNG){
    t+=Math.min(0.30,(now-last)/1000)*TOC;
    if(t>=DUR){t=DUR;DUNG=true;$('#btnPlay').textContent='▶ Chạy'}
    render(t);ui();
  }
  last=now;requestAnimationFrame(loop);
}
function ui(){$('#scrub').value=t.toFixed(2);
  $('#tnum').textContent=t.toFixed(2)+' / '+DUR.toFixed(2)+'s'}
$('#btnPlay').addEventListener('click',()=>{
  if(t>=DUR)t=0; DUNG=!DUNG; last=performance.now();
  $('#btnPlay').textContent=DUNG?'▶ Chạy':'❚❚ Dừng'});
$('#scrub').addEventListener('input',e=>{t=parseFloat(e.target.value);render(t);ui()});
SC.forEach(s=>{const b=document.createElement('button');
  b.textContent=s.a+'s · '+s.ten; b.onclick=()=>{t=s.a;render(t);ui()};$('#chaps').appendChild(b)});

function fit(){
  if(document.body.classList.contains('exporting')){$('#stage').style.transform='none';return}
  const k=Math.min((innerWidth-40)/ST_W,(innerHeight-160)/ST_H,1);
  $('#stage').style.transform='scale('+k+')';
  $('#stage').style.margin='0 0 '+((k-1)*ST_H)+'px';
}
addEventListener('resize',fit);
function khoiDong(){render(0);ui()}

if(/[?&]export=1/.test(location.search)){
  document.body.classList.add('exporting');
  window.__clip={
    duration:DUR/TOC,
    ready:async()=>{
      await napPhuDe();
      await document.fonts.ready;
      await Promise.all([...document.images].filter(i=>i.src).map(i=>i.decode().catch(()=>{})));
      await new Promise(r=>setTimeout(r,260));
      fit();khoiDong();
    },
    play:()=>{DUNG=false;last=performance.now()},
    at:()=>t/TOC, seek:s=>{t=cl(s*TOC,0,DUR);render(t)}, step:s=>{t=cl(s*TOC,0,DUR);render(t)},
  };
}
fit();
napPhuDe().then(()=>document.fonts.ready).then(khoiDong);
requestAnimationFrame(loop);
})();
</script>
