     1. tránh chữ có cặp tối thiểu dấu hỏi / dấu huyền — giọng này không phân
        biệt được hai dấu đó;
     2. chữ mang dấu không đứng áp chót trước dấu phẩy (chỗ đó bị nuốt thanh
        điệu) — kết vế bằng chữ ngang, huyền hoặc nặng;
     3. chữ đầu câu nên không dấu hoặc dấu huyền.
   Thêm một luật riêng của bộ này: MỖI DÒNG ≤ 50 KÝ TỰ. Phụ đề vẽ vào đúng thẻ
   mẹo dưới chân tấm thiết kế, thẻ đó chỉ chứa gọn một dòng.

   Kịch bản cho phép "tùy biến câu từ tương đồng để phù hợp với ElevenLabs hơn"
   nên vài chỗ đổi chữ mà giữ nguyên ý:
     "trả về"  → "cho ra"        ("trả" dấu hỏi, hay bật thành dấu ngã)
     "hoặc…"   → "bạn cũng…"     (mở câu bằng dấu nặng thì bị nuốt)
     "chỉ cần" → "bạn chọn…"     (mở vế bằng dấu hỏi thì bị nuốt)
   ========================================================================== */
const VO=[
  /* --- S01 --- */
  [ 0.45,'Bạn hay dùng công cụ AI nào?'],
  [ 3.15,'Công cụ nào cũng cho ra một kiểu khác nhau.'],
  /* --- S02 --- */
  [ 7.35,'Nhưng bước tiếp theo thì lúc nào cũng giống nhau.'],
  [10.60,'Rồi giờ đưa nó lên đâu?'],
  /* --- S03.1 · dán HTML --- */
  [13.45,'Công cụ cho ra một khối mã trên màn hình,'],
  [17.00,'thì bạn sao chép rồi dán thẳng vào đây.'],
  /* --- S03.2 · tải file nén --- */
  [20.85,'Công cụ cho ra một file nén thì kéo thẳng vào đây,'],
  [24.40,'rồi thả vào ô là xong.'],
  /* --- S03.3 · nối GitHub --- */
    /* "nối một lần" nghe ra "NỔI một lần" — thử riêng câu này thì lần nào
     cũng hỏng. "kết nối" đọc đúng 100%, đúng bài đã rút ở VH-07. */
  [28.25,'Bạn làm việc trên GitHub thì kết nối một lần.'],
  [31.80,'Từ đó cứ đẩy mã lên là nó tự triển khai.'],
  /* --- S03.4 · dán Git URL --- */
    /* "kho mã" nghe ra "KHỔ mã" ở MỌI vị trí — thử sáu cách (thêm tiếng đệm,
     đổi chỗ trong câu, "kho chứa mã", "kho mã nguồn") đều hỏng. Chữ này giọng
     hiện tại không đọc được. "đường dẫn dự án" đọc đúng, không có tiếng lóng
     kỹ thuật, mà vẫn đúng thứ đang hiện trên màn hình. */
  [35.65,'Bạn cũng có thể dán thẳng đường dẫn dự án vào đây.'],
  [39.20,'Xong bước đó là sẵn sàng triển khai.'],
  /* --- S03.5 · import từ Vercel --- */
  [43.05,'Dự án đang chạy trên Vercel cũng mang về được,'],
  [46.60,'bạn chọn nó trong danh sách là xong.'],
  /* --- S03.6 · mẫu có sẵn (cú lật: vào muộn để giữ khoảng trống) --- */
  [50.45,'Còn nếu bạn chưa có gì trong tay,'],
  [54.00,'thì chọn một mẫu có sẵn là nó tự chạy.'],
  /* --- S04 · ba lý do, mỗi câu một thẻ --- */
  [58.00,'Về đây thì bạn trả bằng tiền Việt,'],
  [61.10,'có hoá đơn thuế cho doanh nghiệp,'],
  [64.70,'và khi cần thì bạn hỏi bằng tiếng Việt.'],
  /* --- S05 · chốt. Tên thương hiệu đặt CUỐI CÂU CUỐI: VH-04 đo được đúng chỗ
     đó máy đọc ra "Vibe Host", còn đứng áp chót trước dấu phẩy thì bị nuốt. --- */
  [69.10,'Bạn dùng công cụ nào cũng được,'],
  [71.40,'bước cuối cùng thì chỉ có một.'],
  [73.90,'Bạn cứ thoải mái sáng tạo,'],
  [76.10,'phần đưa lên mạng đã có Vibe Host.'],
];

/* ---------- NẮN CHỮ CHO MÁY ĐỌC ----------
   [chữ trong VO, cách đọc]. Chỉ đổi chuỗi GỬI cho máy đọc — chữ trên phụ đề
   giữ nguyên. Bảng này chạy TRƯỚC bảng chung trong cach-doc.mjs. */
const PHIEN_AM=[
  /* Để mộc thì tên thương hiệu ra "VIP Host" — sai hẳn tên sản phẩm ngay chữ
     cuối cùng của phim. Đã thử lại đúng câu chốt rồi chép nghe mù:
       Vibe Host  đọc rời một mình        → nghe "vibe host"   ✅
       Vibe Host  đọc trong dây chuyền    → nghe "VIP Host"    ✗  (logprob -1,11)
     Tức mộc là ĂN MAY THEO LƯỢT, không phải luật — đúng như VH-07 ghi (mộc ra
     "VIP" 7/7 lượt). Nên vẫn dùng cách viết đã chốt ở VH-07 và VH-05: nhả âm
     chắc, và quan trọng hơn là CẢ BỘ CLIP đọc tên giống nhau. Bộ chép nghe
     thành "ViperHost" là chuyện của bộ chép, không phải chuyện của tai người. */
  ['Vibe Host','Vai-bơ Host'],
];

/* ==========================================================================
   DỰNG CẢNH
   ========================================================================== */
const NEN_TAM=['#fcfcfd','#fcfcfd','#fbfbfc','#fbfbfc','#fbfbfc','#fbfbfc',
               '#fbfbfc','#fbfbfc','#fdfdfd','#fdfbfa'];
const stage=$('#stage');
stage.style.width=ST_W+'px'; stage.style.height=ST_H+'px';

const dat=(e,box)=>{const [x0,y0,x1,y1]=box;
  e.style.left=px(x0*KX); e.style.top=px(y0*KY);
  e.style.width=px((x1-x0)*KX); e.style.height=px((y1-y0)*KY)};

SC.forEach(s=>{
  const sc=el('div','sc'), kb=el('div','kb');
  const im=el('img'); im.src=MK+ANH[s.src]; im.alt='';
  im.style.width=NEN_W+'px'; im.style.height=NEN_H+'px';
  kb.appendChild(im); sc.appendChild(kb);
  sc.style.background=NEN_TAM[s.src];
  stage.appendChild(sc);
  s.el=sc; s.kb=kb;

  /* xoá nhãn cảnh sản xuất — tâm đục hẳn, mép tan dần nên không lộ đường viền */
  const x=el('div','xoa'); dat(x,s.chip);
  x.style.background='radial-gradient(ellipse at center,'
    +'#fdfdfd 0%,#fdfdfd 62%,rgba(253,253,253,.86) 82%,rgba(253,253,253,0) 100%)';
  kb.appendChild(x);

  /* phủ phần CHỮ của thẻ mẹo rồi vẽ lại phụ đề vào đúng ô đó */
  const p=el('div'); dat(p,s.tip);
  p.style.position='absolute'; p.style.background=T;
  kb.appendChild(p);
  const tip=el('div','tip'); dat(tip,s.tip);
  tip.appendChild(el('span'));
  tip.firstElementChild.style.fontSize=px(29*KX);
  kb.appendChild(tip);
  s.tip_el=tip; s.tip_w=(s.tip[2]-s.tip[0])*KX;
});

/* Miếng phủ đặt trên nền CÓ MÀU (dải trang trí hồng cam, vùng đổ bóng) mà để
   mép cứng thì lúc mờ đi hiện ra một hình chữ nhật trắng — nhìn ra ngay là lớp
   phủ. Cờ `m:1` cho miếng đó nở ra 30 điểm ảnh mỗi bên rồi làm mờ chính nó:
   phần ruột vẫn đục kín đúng cái cần giấu, còn mép thì tan dần vào nền nên
   không còn đường ranh nào. Đo trên bảng màu quanh từng ô rồi mới đặt `mau`,
   nên ngay cả lúc còn đục nó cũng gần như trùng nền. */
const NOI=30;                       /* nở ra bao nhiêu điểm ảnh gốc mỗi bên */
/* Lớp phủ BAO cả một khoảng (khung Vibe Host, nền ba thẻ S04) phải nằm TRÊN
   mấy lớp phủ nhỏ bên trong nó — hai bên chênh nhau vài mức màu, để dưới thì
   lúc còn đục hiện ra mấy vệt trắng cắt ngang. Xếp lại thứ tự ngay ở đây thay
   vì đảo dòng trong bảng: bảng nên đọc theo NHỊP, không theo thứ tự vẽ. */
LOP.sort((a,b)=>(a.sc-b.sc)||((a.tren?1:0)-(b.tren?1:0)));
LOP.forEach(L=>{
  const e=el('div', L.k==='vong'?'vong':'che');
  const b=L.m?[L.box[0]-NOI,L.box[1]-NOI,L.box[2]+NOI,L.box[3]+NOI]:L.box;
  dat(e,b);
  if(L.m) e.style.filter='blur('+(NOI*KX*0.40).toFixed(1)+'px)';
  if(L.k==='che'){ e.style.background=L.mau; e.style.transformOrigin='right center' }
  if(L.k==='doc'){ e.style.background=L.mau; e.style.transformOrigin='center bottom' }
  if(L.k==='mo'){ e.style.background=L.mau }
  SC[L.sc].kb.appendChild(e);
  /* mốc khai theo giờ TƯƠNG ĐỐI trong cảnh → đổi sang giờ tuyệt đối ở đây */
  const g=SC[L.sc].a;
  L.A = L.a>=99 ? 9999 : L.a+g;
  L.B = L.b>=99 ? 9999 : L.b+g;
  L.el=e;
});

/* ==========================================================================
   MÁY QUAY — nhận khung ngắm theo toạ độ ảnh, tự tính phóng và dời
   ========================================================================== */
function ngam(v){
  const [x0,y0,x1,y1]=v;
  const w=(x1-x0)*KX, h=(y1-y0)*KY;
  const s=Math.min(ST_W/w, ST_H/h);
  const cx=(x0+x1)/2*KX, cy=(y0+y1)/2*KY;
  return {s, tx:ST_W/2-s*cx, ty:ST_H/2-s*cy};
}
const trung=(a,b,k)=>[lerp(a[0],b[0],k),lerp(a[1],b[1],k),lerp(a[2],b[2],k),lerp(a[3],b[3],k)];

/* ==========================================================================
   PHỤ ĐỀ — mốc lấy từ vị trí THẬT của tiếng, do bộ lồng tiếng ghi ra

   Câu này giữ trên màn hình cho tới lúc câu SAU cất tiếng, không tắt ở chỗ hết
   tiếng: chữ nằm trong thẻ mẹo đã thiết kế sẵn nên để trống một nhịp là thẻ hở
   ra một mảng trắng, nhìn như lỗi in.
   ========================================================================== */
let PD=VO.map((v,i,a)=>({tu:v[0], den:(a[i+1]?a[i+1][0]:DUR), loi:v[1]}));
async function napPhuDe(){
  try{
    const r=await fetch('out/voiceover/phu-de-vibe-host-6-cach.json',{cache:'no-store'});
    if(r.ok){const j=await r.json(); if(Array.isArray(j)&&j.length)PD=j}
  }catch(e){}
  /* dù bảng ghi `den` theo chỗ hết tiếng, vẫn kéo dài tới câu sau */
  PD=PD.map((c,i,a)=>({...c, den:(a[i+1]?a[i+1].tu:DUR)}));
  PD[0].tu=0;
}
let pdI=-1;

function render(t){
  SC.forEach((s,i)=>{
    const HOA=0.42;
    const vao=seg(t,s.a-(i?HOA:0),s.a-(i?HOA:0)+HOA,eIO);
    const ra=i===SC.length-1?0:seg(t,s.b-HOA,s.b,eIO);
    const o=i===0?1-ra:vao*(1-ra);
    setO(s.el,o);
    if(o<0.002)return;
    const k=eIO(tt(t,s.a-HOA,s.b));
    const c=ngam(trung(s.v0,s.v1,k));
    s.kb.style.transform='translate('+px(c.tx)+','+px(c.ty)+') scale('+c.s.toFixed(4)+')';
  });

  LOP.forEach(L=>{
    if(L.k==='che'){
      const q=1-seg(t,L.A,L.B,eOut);
      L.el.style.transform='scaleX('+q.toFixed(4)+')';
      setO(L.el, t>L.B+0.25?0:1);
      return;
    }
    if(L.k==='doc'){
      const q=1-seg(t,L.A,L.B,eIO);
      L.el.style.transform='scaleY('+q.toFixed(4)+')';
      setO(L.el, t>L.B+0.25?0:1);
      return;
    }
    if(L.k==='mo'){
      setO(L.el, t<L.A?1:(t>L.B?0:1-eIO(tt(t,L.A,L.B))));
      return;
    }
    setO(L.el, pop(t,L.A,L.B,.24,.28));       /* vong */
  });

  {
    const i=PD.findIndex(c=>t>=c.tu-0.10 && t<c.den);
    /* Thẻ mẹo trên tấm thiết kế chỉ chứa gọn MỘT dòng, nên câu dài thì thu chữ
       lại chứ không cho xuống dòng — xuống dòng là chữ tràn khỏi thẻ. */
    if(i!==pdI){ pdI=i; if(i>=0)SC.forEach(s=>{
      const sp=s.tip_el.firstElementChild;
      sp.style.transform='none'; sp.textContent=PD[i].loi;
      const k=Math.min(1, s.tip_w/Math.max(1,sp.getBoundingClientRect().width));
      if(k<1) sp.style.transform='scale('+k.toFixed(3)+')';
    }) }
    const o=i<0?0:pop(t,PD[i].tu-0.10,PD[i].den,.22,.16);
    SC.forEach(s=>setO(s.tip_el,o));
  }
}

/* ==========================================================================
   CHẠY / TUA
   ========================================================================== */
const TOC=Math.max(0.25,Math.min(4,parseFloat(new URLSearchParams(location.search).get('toc'))||1));
let t=0,DUNG=true,last=0;
function loop(now){
  if(!DUNG){
    t+=Math.min(0.30,(now-last)/1000)*TOC;
    if(t>=DUR){t=DUR;DUNG=true;$('#btnPlay').textContent='▶ Chạy'}
    render(t);ui();
  }
  last=now;requestAnimationFrame(loop);
}
function ui(){$('#scrub').value=t.toFixed(2);
  $('#tnum').textContent=t.toFixed(2)+' / '+DUR.toFixed(2)+'s'}
$('#btnPlay').addEventListener('click',()=>{
  if(t>=DUR)t=0; DUNG=!DUNG; last=performance.now();
  $('#btnPlay').textContent=DUNG?'▶ Chạy':'❚❚ Dừng'});
$('#scrub').addEventListener('input',e=>{t=parseFloat(e.target.value);render(t);ui()});
SC.forEach(s=>{const b=document.createElement('button');
  b.textContent=s.a.toFixed(1)+'s · '+s.ten; b.onclick=()=>{t=s.a;render(t);ui()};$('#chaps').appendChild(b)});

function fit(){
  if(document.body.classList.contains('exporting')){$('#stage').style.transform='none';return}
  const k=Math.min((innerWidth-40)/ST_W,(innerHeight-160)/ST_H,1);
  $('#stage').style.transform='scale('+k+')';
  $('#stage').style.margin='0 0 '+((k-1)*ST_H)+'px';
}
addEventListener('resize',fit);
function khoiDong(){render(0);ui()}

if(/[?&]export=1/.test(location.search)){
  document.body.classList.add('exporting');
  window.__clip={
    duration:DUR/TOC,
    ready:async()=>{
      await napPhuDe();
      await document.fonts.ready;
      await Promise.all([...document.images].filter(i=>i.src).map(i=>i.decode().catch(()=>{})));
      await new Promise(r=>setTimeout(r,260));
      fit();khoiDong();
    },
    play:()=>{DUNG=false;last=performance.now()},
    at:()=>t/TOC, seek:s=>{t=cl(s*TOC,0,DUR);render(t)}, step:s=>{t=cl(s*TOC,0,DUR);render(t)},
  };
}
fit();
napPhuDe().then(()=>document.fonts.ready).then(khoiDong);
requestAnimationFrame(loop);
})();
</script>
