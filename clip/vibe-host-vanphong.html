body.exporting #ui,body.exporting #chaps{display:none}

#stage{position:relative;overflow:hidden;background:#fff;

.sc{position:absolute;inset:0;will-change:opacity}
.kb{position:absolute;inset:0;transform-origin:0 0;will-change:transform}

.xoa{position:absolute;pointer-events:none}

.tep i{width:15px;height:19px;border-radius:2px;background:#eef1f6;border:1px solid #cfd6e2;

#c1{font-size:44px;font-weight:700;line-height:1.14;letter-spacing:-.02em;color:var(--muc);

#c2{margin-top:9px;font-size:23px;font-weight:500;line-height:1.3;color:var(--xam);

#ket img{position:relative;height:100%;width:auto;object-fit:contain;display:block;flex:none}

#scrub{width:520px}
#chaps{display:flex;flex-wrap:wrap;gap:6px;max-width:1280px;justify-content:center}
#chaps button{background:#1b2331;color:#c9d3e2;border:0;border-radius:7px;padding:5px 10px;

  [46.90,'Việc nào của phòng cũng lên mạng được trong vài phút.'],
];

/* ==========================================================================
   DỰNG CẢNH
   ========================================================================== */
/* Nền mỗi tấm một sắc trắng-xám riêng. Khung ngắm cố ý rộng hơn ảnh để có lề,
   nên phần ngoài ảnh phải tô ĐÚNG màu nền tấm đó — để trắng tinh là khung hình
   chia làm hai mảng màu khác nhau, nhìn ra ngay. */
const NEN_TAM=V?['#f8f9fd','#f9fafd','#f7f8fc','#f7f8fc','#f7f9fc','#f8f9fc']
              :['#ffffff','#ffffff','#ffffff','#ffffff','#ffffff','#ffffff'];
const stage=$('#stage');
stage.style.width=ST_W+'px'; stage.style.height=ST_H+'px';
if(V){
  document.body.classList.add('doc');
  /* Bản dọc: chữ nhỏ lại cho vừa bề ngang, phụ đề nâng cao khỏi vùng nút bấm của
     TikTok/Reels (khoảng 200px dưới cùng của khung 1920). */
  const st=document.createElement('style');
  st.textContent=`#khoi{padding:0 40px 250px}#c1{font-size:38px}#c2{font-size:20px}
    #nen{height:430px}#pd{left:26px;right:26px;bottom:132px}#pd span{font-size:23px;padding:7px 15px}
    #ketChu b{font-size:34px}#ketChu i{font-size:18px}`;
  document.head.appendChild(st);
}
const truoc=$('#nen');
SC.forEach((s,i)=>{
  const sc=el('div','sc'), kb=el('div','kb');
  if(s.src==='ket'){
    const k=el('div',null,'<img alt="">'
      +'<div id="ketChu"><b>Thôi gửi file. <em>Gửi một đường link.</em></b>'
      +'<i>Dùng thử miễn phí 7 ngày · từ 79.000đ/tháng</i>'
      +'<u>Giá chưa gồm VAT · áp dụng khi mua tối thiểu 3 tháng</u></div>');
    k.id='ket'; sc.appendChild(k); s.ket=k.querySelector('img');
    s.ket.src=MK_D+'ket.png';
  }else{
    const im=el('img'); im.src=MK+ANH[s.src]; im.alt='';
    im.style.width=NEN_W+'px'; im.style.height=NEN_H+'px';
    kb.appendChild(im);
    sc.appendChild(kb);
  }
  if(typeof s.src==='number' && NEN_TAM[s.src]) sc.style.background=NEN_TAM[s.src];
  stage.insertBefore(sc,truoc);
  s.el=sc; s.kb=kb;
});
XOA.forEach(([i,x0,y0,x1,y1,chiCanh,mau])=>{
  const s=SC.find((c,k)=>c.src===i && c.kb);
  SC.forEach(c=>{
    if(c.src!==i||!c.kb)return;
    if(chiCanh!=null && SC.indexOf(c)!==chiCanh)return;
    const e=el('div','xoa');
    e.style.left=px(x0*KX); e.style.top=px(y0*KY);
    e.style.width=px((x1-x0)*KX); e.style.height=px((y1-y0)*KY);
    e.style.background=mau||'#fff';
    c.kb.appendChild(e);
  });
});

LOP.forEach(L=>{
  const e=el('div', L.k==='che'?'che':L.k==='tep'?'tep':'vong');
  const [x0,y0,x1,y1]=L.box;
  e.style.left=px(x0*KX); e.style.top=px(y0*KY);
  e.style.width=px((x1-x0)*KX); e.style.height=px((y1-y0)*KY);
  if(L.k==='che'){ e.style.background=L.mau||'#fbfbfd'; e.style.transformOrigin='right center' }
  if(L.k==='tep'){ e.innerHTML='<b>'+(L.ten||'website-dangky.zip')+'</b><i></i>' }
  const c=SC[L.sc]; if(c.kb)c.kb.appendChild(e);
  L.el=e;
});

/* ==========================================================================
   MÁY QUAY — nhận khung ngắm theo toạ độ ảnh, tự tính phóng và dời
   ========================================================================== */
function ngam(v){
  const [x0,y0,x1,y1]=v;
  const w=(x1-x0)*KX, h=(y1-y0)*KY;
  const s=Math.min(ST_W/w, ST_H/h);          /* vừa khít, không cắt mất mép */
  const cx=(x0+x1)/2*KX, cy=(y0+y1)/2*KY;
  return {s, tx:ST_W/2-s*cx, ty:ST_H/2-s*cy};
}
function trung(a,b,k){
  return [lerp(a[0],b[0],k),lerp(a[1],b[1],k),lerp(a[2],b[2],k),lerp(a[3],b[3],k)];
}

/* ==========================================================================
   PHỤ ĐỀ — mốc lấy từ vị trí thật của tiếng, do bộ lồng tiếng ghi ra
   ========================================================================== */
let PD=VO.map((v,i,a)=>({tu:v[0], den:(a[i+1]?a[i+1][0]:DUR)-0.05, loi:v[1]}));
async function napPhuDe(){
  try{
    const r=await fetch('out/voiceover/phu-de-vibe-host-vanphong.json',{cache:'no-store'});
    if(r.ok){const j=await r.json(); if(Array.isArray(j)&&j.length)PD=j}
  }catch(e){}
}
let pdI=-1;

const E={nen:$('#nen'),khoi:$('#khoi'),gach:$('#gach'),c1:$('#c1'),c2:$('#c2'),pd:$('#pd')};
let chuI=-1;
const HOA=0.42;                              /* thời gian chuyển cảnh */

function render(t){
  SC.forEach((s,i)=>{
    const vao=seg(t,s.a-(i?HOA:0),s.a-(i?HOA:0)+HOA,eIO);
    const ra=i===SC.length-1?0:seg(t,s.b-HOA,s.b,eIO);
    const o=i===0?1-ra:vao*(1-ra);
    setO(s.el,o);
    if(o<0.002||!s.kb)return;
    const k=eIO(tt(t,s.a-HOA,s.b));
    const c=ngam(trung(V?s.d0:s.v0, V?s.d1:s.v1, k));
    s.kb.style.transform='translate('+px(c.tx)+','+px(c.ty)+') scale('+c.s.toFixed(4)+')';
  });

  /* lớp vẽ đè */
  LOP.forEach(L=>{
    if(L.k==='che'){
      /* Hé nội dung từ trái sang phải: miếng che co dần về mép phải, để lộ đúng
         những điểm ảnh có sẵn của ảnh gốc — khớp phông chữ tuyệt đối, hơn hẳn gõ
         lại bằng chữ của trang. Đặt `tat:true` thì không co mà tắt hẳn một nhịp
         (dùng cho ô thả: trống trước, có tệp sau). */
      if(L.tat){ setO(L.el, t<L.a?1:(t>L.b?0:1-tt(t,L.a,L.b))); return }
      const q=1-tt(t,L.a,L.b);
      L.el.style.transform='scaleX('+q.toFixed(4)+')';
      setO(L.el, t>L.b+0.25?0:1);
      return;
    }
    if(L.k==='tep'){
      /* Gói tin bay vào ô thả. Ngang và dọc dùng hai nhịp KHÁC nhau để đường đi
         cong như tay người kéo — đi thẳng một đường là thấy ngay máy chạy. Kèm
         nghiêng nhẹ rồi thẳng lại, bóng đổ khép dần, và lún một nhịp lúc chạm. */
      const k=tt(t,L.a,L.b);
      const kx=eOut(k), ky=eIn(k*0.86)+k*0.14;
      const dx=lerp(L.tu[0],L.den[0],kx)*KX, dy=lerp(L.tu[1],L.den[1],ky)*KY;
      const lun=k>0.88?Math.sin((k-0.88)/0.12*Math.PI)*0.06:0;
      const nghieng=(1-eOut(k))*-5;
      L.el.style.transform='translate('+px(dx)+','+px(dy)+') rotate('+nghieng.toFixed(2)
        +'deg) scale('+(1-0.10*kx-lun).toFixed(3)+')';
      L.el.style.boxShadow='0 '+(26-18*k).toFixed(0)+'px '+(48-30*k).toFixed(0)
        +'px rgba(15,23,34,'+(0.26-0.14*k).toFixed(3)+')';
      setO(L.el, Math.min(seg(t,L.a-0.30,L.a-0.02,eOut), 1-seg(t,L.b-0.06,L.b+0.10,eIn)));
      return;
    }
    setO(L.el, pop(t,L.a,L.b,.24,.28));
  });

  /* chữ tiêu đề */
  let ci=-1;
  CHU.forEach(([a,b],i)=>{ if(b>a && t>=a-0.12 && t<=b+0.12) ci=i });
  if(ci!==chuI){
    chuI=ci;
    if(ci>=0){ E.c1.innerHTML=SC[ci].c1; E.c2.innerHTML=SC[ci].c2 }
  }
  if(ci<0){ setO(E.khoi,0); setO(E.nen,0) }
  else{
    const [a,b]=CHU[ci];
    const v=seg(t,a,a+0.42,eOut), r=seg(t,b-0.34,b,eIn);
    const o=v*(1-r);
    setO(E.khoi,o); setO(E.nen,o*0.98);
    E.gach.style.transform='scaleX('+seg(t,a,a+0.5,eOut).toFixed(3)+')';
    E.gach.style.transformOrigin='left center';
    E.c1.style.transform='translateY('+px((1-v)*26+r*-12)+')';
    E.c2.style.transform='translateY('+px((1-seg(t,a+0.10,a+0.62,eOut))*20+r*-9)+')';
  }

  /* phụ đề */
  {
    const i=PD.findIndex(c=>t>=c.tu-0.12 && t<=c.den+0.18);
    if(i!==pdI){ pdI=i; if(i>=0)E.pd.firstElementChild.innerHTML=PD[i].loi }
    setO(E.pd, i<0?0:pop(t,PD[i].tu-0.12,PD[i].den+0.18,.14,.16));
  }
}

/* ==========================================================================
   CHẠY / TUA
   ========================================================================== */
const TOC=Math.max(0.25,Math.min(4,parseFloat(new URLSearchParams(location.search).get('toc'))||1));
let t=0,DUNG=true,last=0;
function loop(now){
  if(!DUNG){
    t+=Math.min(0.30,(now-last)/1000)*TOC;
    if(t>=DUR){t=DUR;DUNG=true;$('#btnPlay').textContent='▶ Chạy'}
    render(t);ui();
  }
  last=now;requestAnimationFrame(loop);
}
function ui(){$('#scrub').value=t.toFixed(2);
  $('#tnum').textContent=t.toFixed(2)+' / '+DUR.toFixed(2)+'s'}
$('#btnPlay').addEventListener('click',()=>{
  if(t>=DUR)t=0; DUNG=!DUNG; last=performance.now();
  $('#btnPlay').textContent=DUNG?'▶ Chạy':'❚❚ Dừng'});
$('#scrub').addEventListener('input',e=>{t=parseFloat(e.target.value);render(t);ui()});
[[0,'S01 Hook'],[5,'S02 Một link'],[11,'S03 Kể AI'],[17,'S04 Xong'],[24,'S05 Lên mạng'],
 [31,'S06 Database'],[40,'S07 Link không đổi'],[46,'S08 Kết']]
.forEach(([s,n])=>{const b=document.createElement('button');
  b.textContent=s+'s · '+n; b.onclick=()=>{t=s;render(t);ui()};$('#chaps').appendChild(b)});

function fit(){
  if(document.body.classList.contains('exporting')){$('#stage').style.transform='none';return}
  const k=Math.min((innerWidth-40)/ST_W,(innerHeight-160)/ST_H,1);
  $('#stage').style.transform='scale('+k+')';
  $('#stage').style.margin='0 0 '+((k-1)*ST_H)+'px';
}
addEventListener('resize',fit);
function khoiDong(){render(0);ui()}

if(/[?&]export=1/.test(location.search)){
  document.body.classList.add('exporting');
  window.__clip={
    duration:DUR/TOC,
    ready:async()=>{
      await napPhuDe();
      await document.fonts.ready;
      await Promise.all([...document.images].filter(i=>i.src).map(i=>i.decode().catch(()=>{})));
      await new Promise(r=>setTimeout(r,260));   /* chờ canvas cắt thẻ kết xong */
      fit();khoiDong();
    },
    play:()=>{DUNG=false;last=performance.now()},
    at:()=>t/TOC, seek:s=>{t=cl(s*TOC,0,DUR);render(t)}, step:s=>{t=cl(s*TOC,0,DUR);render(t)},
  };
}
fit();
napPhuDe().then(()=>document.fonts.ready).then(khoiDong);
requestAnimationFrame(loop);
})();
</script>
