<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vibe Host — Marketer (9:16, UI thật ở đoạn deploy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   CLIP MARKETER — khung dọc 9:16

   Sáu cảnh dựng trên 6 mockup trong public/image/vibehostmarketer/, CỘNG một
   cảnh deploy dùng GIAO DIỆN VIBE HOST THẬT dựng bằng HTML/CSS (không phải ảnh):
   chọn nguồn “Tải file” → kéo-thả gói vongquay-mayman.zip → ba bước triển khai
   → website lên mạng. Nhờ là DOM thật nên con trỏ bấm đúng nút, trạng thái đổi
   thật, và phóng bao nhiêu cũng nét.

   Chuyển động trên ảnh tĩnh làm bằng ba thứ nguyên thuỷ, khai báo theo dữ liệu:
     · che   — khối màu trùng nền, co lại để hé dần nội dung có sẵn (gõ chữ,
               đổ dòng bảng, chạy thanh tiến trình)
     · vòng  — khung sáng bao quanh một thành phần, bung ra rồi thở nhẹ
     · quay  — khoét hình khuyên rồi xoay (bánh xe quay thật)
   ========================================================================== */
:root{
  --cam:#e2530e; --cam-2:#f2803a; --cam-mo:#fef6f2;
  --xanh:#16a34a;
  --giay:#ffffff; --giay-2:#f8fafa; --vien:#e8eaee; --vien-2:#eef0f4;
  --chu:#111827; --chu-2:#374151; --chu-mo:#6b7280; --chu-nhat:#9ca3af;
  --ink:#212230; --ink-2:#383945; --ink-3:#2a2b38;
  --nen:#0e1119;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#05070c;color:#fff;font-family:'Be Vietnam Pro',system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;overflow:hidden}
#stage{position:relative;width:720px;height:1280px;overflow:hidden;background:var(--nen);
  border-radius:12px;transform-origin:50% 50%;-webkit-font-smoothing:antialiased}
body.exporting{background:#000;gap:0}
body.exporting #stage{border-radius:0}
body.exporting #ui,body.exporting #chaps{display:none}

/* ---------- cảnh ảnh ---------- */
.sc{position:absolute;inset:0;overflow:hidden;will-change:opacity}
.kb{position:absolute;inset:0;will-change:transform}
.kb>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

/* ba thứ nguyên thuỷ vẽ đè lên ảnh */
.che{position:absolute;will-change:transform}
.vong{position:absolute;border:3px solid var(--cam-2);border-radius:12px;
  box-shadow:0 0 0 5px rgba(242,128,58,.18),0 10px 34px rgba(242,128,58,.30);
  will-change:transform,opacity;pointer-events:none}
.vong.tron{border-radius:999px}

/* ---------- lớp phủ toàn khung ---------- */
/* Nền sân khấu — chỉ lộ ra ở cảnh deploy (hai dải trên/dưới cửa sổ trình duyệt).
   Trước đây gần như đen tuyền nên nhìn nặng và trống; giờ là dải chuyển màu ấm
   có quầng cam của thương hiệu, chữ trắng đặt lên vẫn nổi. */
#nenSau{position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(120% 52% at 50% 12%, rgba(226,83,14,.26), transparent 62%),
    radial-gradient(86% 46% at 82% 92%, rgba(58,104,225,.18), transparent 66%),
    linear-gradient(168deg,#1b2030 0%,#12151f 52%,#1c1526 100%)}
#nenLuoi{position:absolute;inset:0;pointer-events:none;opacity:.42;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:52px 52px;
  -webkit-mask-image:radial-gradient(118% 82% at 50% 46%,#000 26%,transparent 76%);
          mask-image:radial-gradient(118% 82% at 50% 46%,#000 26%,transparent 76%)}
#vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(122% 76% at 50% 40%,transparent 52%,rgba(0,0,0,.46) 100%)}
#sweep{position:absolute;top:-30%;left:-60%;width:70%;height:160%;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);
  transform:rotate(14deg);will-change:transform,opacity}
#conf{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#conf i{position:absolute;display:block;border-radius:1px;will-change:transform}
#flash{position:absolute;inset:0;background:#fff;mix-blend-mode:screen;opacity:0}
#den{position:absolute;inset:0;background:#04060a;will-change:opacity}

/* ---------- chữ ---------- */
/* Padding đáy 268 chứ không phải 108 như ban đầu: chừa chỗ cho dải phụ đề bên
   dưới, hai lớp chữ chồng nhau thì không đọc được lớp nào. Còn phụ đề để ở 138
   (tức ~207px trên bản xuất 1920) là để vượt khỏi vùng TikTok/Reels phủ nút bấm
   và mô tả — đặt sát đáy thì chữ nằm dưới lớp giao diện của nền tảng. */
#txt{position:absolute;left:0;right:0;bottom:0;padding:0 52px 296px;pointer-events:none}
/* phụ đề: nền mờ bo tròn để chữ trắng còn đọc được khi trôi qua vòng quay sáng */
#pd{position:absolute;left:40px;right:40px;bottom:138px;text-align:center;pointer-events:none}
#pd span{display:inline-block;padding:9px 20px;border-radius:14px;
  background:rgba(6,9,14,.62);backdrop-filter:blur(2px);
  font-size:30px;font-weight:600;line-height:1.32;color:#fff;letter-spacing:-.005em;
  text-shadow:0 3px 14px rgba(0,0,0,.85)}
#scrim{position:absolute;left:0;right:0;bottom:0;height:520px;pointer-events:none;
  background:linear-gradient(to top,rgba(4,6,10,.94) 6%,rgba(4,6,10,.70) 34%,transparent 100%);
  will-change:opacity}
#bar2{width:64px;height:5px;border-radius:99px;background:linear-gradient(90deg,var(--cam-2),var(--cam));
  margin-bottom:18px;will-change:transform,opacity}
#t1{font-size:52px;font-weight:700;line-height:1.13;letter-spacing:-.02em;
  text-shadow:0 6px 30px rgba(0,0,0,.65);will-change:transform,opacity}
#t2{margin-top:12px;font-size:27px;font-weight:500;line-height:1.3;color:#d6dbe4;
  text-shadow:0 4px 20px rgba(0,0,0,.65);will-change:transform,opacity}
#t1 em{font-style:normal;color:var(--cam-2)}

/* chữ hook cảnh mở đầu — to, đập thẳng vào mắt */
/* Đặt DƯỚI, trong khoảng trống bên dưới bánh xe. Đặt ở trên thì con số đè thẳng
   lên tiêu đề “VÒNG QUAY MAY MẮN” in sẵn trong ảnh — nhìn như lỗi hiển thị. */
#hook{position:absolute;left:0;right:0;bottom:296px;text-align:center;pointer-events:none}
#hookN{font-family:'Space Grotesk',sans-serif;font-size:104px;font-weight:700;line-height:1;
  letter-spacing:-.03em;background:linear-gradient(92deg,#ffc48a,var(--cam-2) 55%,var(--cam));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 8px 30px rgba(0,0,0,.6));will-change:transform,opacity}
#hookS{margin-top:4px;font-size:31px;font-weight:600;color:#fff;
  text-shadow:0 5px 24px rgba(0,0,0,.7);will-change:transform,opacity}

#prog{position:absolute;left:0;bottom:0;height:4px;
  background:linear-gradient(90deg,var(--cam-2),var(--cam));opacity:.85}

/* ---------- con trỏ ---------- */
#cursor{position:absolute;width:30px;height:30px;margin:-2px 0 0 -2px;
  filter:drop-shadow(0 3px 7px rgba(0,0,0,.6));will-change:transform}
#ripple{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;
  border:2.5px solid rgba(242,128,58,.95);will-change:transform,opacity}

/* ---------- cửa sổ trình duyệt cho cảnh deploy ---------- */
#win{position:absolute;border-radius:14px;overflow:hidden;background:#fff;
  box-shadow:0 46px 100px -22px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.10);
  will-change:transform,opacity}
#chrome{position:absolute;left:0;top:0;width:100%;height:38px;background:#1b1d27;
  display:flex;align-items:center;gap:9px;padding:0 14px;border-bottom:1px solid #2a2d3a}
.dot{width:10px;height:10px;border-radius:50%}
#urlbar{flex:1;height:22px;margin-left:8px;border-radius:999px;background:#0f1219;
  display:flex;align-items:center;gap:7px;padding:0 12px;
  font-family:'JetBrains Mono',monospace;font-size:11px;color:#9aa4b5}
#urlbar b{color:#dbe3ef;font-weight:500}
#viewport{position:absolute;left:0;overflow:hidden;background:#fff}
/* ==========================================================================
   ỨNG DỤNG — mọi con số bên dưới là px THẬT của giao diện (khung 1914×950)
   ========================================================================== */
#app{position:absolute;left:0;top:0;width:1914px;height:780px;background:#fff;overflow:hidden;
  transform-origin:0 0;font-size:14px;color:var(--chu)}

/* ----- thanh bên ----- */
#sidebar{position:absolute;left:0;top:0;width:268px;height:780px;background:var(--ink)}
#logo{position:absolute;left:16px;top:15px;display:flex;align-items:center;gap:12px}
#logoMark{width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,#f7a03c,var(--cam));display:flex;align-items:center;justify-content:center}
#logoTxt{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:21px;letter-spacing:-.01em;
  background:linear-gradient(92deg,#f7913f,var(--cam));-webkit-background-clip:text;background-clip:text;color:transparent}
#collapse{position:absolute;left:222px;top:23px;opacity:.55}
#navLabel{position:absolute;left:24px;top:90px;font-size:11px;font-weight:600;
  letter-spacing:.10em;color:#79818f}
.nav{position:absolute;left:13px;width:240px;height:38px;border-radius:10px;
  display:flex;align-items:center;gap:13px;padding-left:13px;color:#dfe3ea}
.nav svg{opacity:.85;flex:none}
.nav span{font-size:14px;font-weight:500}
.nav.on{background:var(--ink-2)}
.nav.on span{color:#fff;font-weight:600}
.nav.on svg{opacity:1}
#sideFoot{position:absolute;left:16px;top:648px;width:236px;height:100px;
  background:var(--ink-3);border-radius:10px;padding:11px 13px}
#sideFoot .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
#sideFoot .hd b{font-size:12.5px;font-weight:600;color:#e6eaf1;letter-spacing:.02em}
#sideFoot .hd i{font-style:normal;font-size:10.5px;color:#c9d0dc;background:#3a3c4a;
  border-radius:999px;padding:3px 9px}
#sideFoot .r{display:flex;justify-content:space-between;font-size:11px;line-height:1.95}
#sideFoot .r span{color:#98a1b0}
#sideFoot .r b{color:#cfd6e2;font-weight:500}

/* ----- vùng nội dung + thanh trên ----- */
#main{position:absolute;left:268px;top:0;width:1646px;height:780px;background:#fff;
  border-left:1px solid #ececf0;border-top-left-radius:14px}
#topbar{position:absolute;right:32px;top:22px;display:flex;align-items:center;gap:14px}
.tbtn{height:34px;border-radius:9px;border:1px solid var(--vien);display:flex;align-items:center;
  justify-content:center;color:var(--chu-2)}
#tbEn{width:38px;font-size:12px;font-weight:600}
#tbMoon{width:34px}
#tbSep{width:1px;height:28px;background:var(--vien)}
#tbUser{display:flex;align-items:center;gap:10px}
#tbAv{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#f7a03c,var(--cam));
  display:flex;align-items:center;justify-content:center}
#tbUser .n{font-size:12.5px;font-weight:600;color:#1f2937;line-height:1.25}
#tbUser .e{font-size:11px;color:#8b93a1;line-height:1.25}

/* ----- trang ----- */
.page{position:absolute;left:38px;top:0;width:1560px;height:780px;will-change:opacity}
.pgH{position:absolute;left:0;top:88px;font-size:27px;font-weight:700;letter-spacing:-.015em}
.pgS{position:absolute;left:0;top:130px;font-size:13.5px;color:var(--chu-mo)}
.card{position:absolute;background:#fff;border:1px solid var(--vien-2);border-radius:14px}
.ttl{position:absolute;font-size:16px;font-weight:700}
.sub{position:absolute;font-size:12.5px;color:var(--chu-nhat)}

/* thẻ số */
.stat{width:372px;height:144px;top:174px;
  background:linear-gradient(150deg,#fff 55%,#fff8f2);border:1px solid var(--vien-2);
  border-radius:14px;position:absolute}
.stat .l{position:absolute;left:26px;top:26px;font-size:14.5px;font-weight:600;color:#1f2937}
.stat .n{position:absolute;left:26px;top:56px;font-size:34px;font-weight:700;color:#0f172a;line-height:1}
.stat .s{position:absolute;left:26px;top:110px;font-size:12.5px;color:var(--chu-nhat)}
.stat .i{position:absolute;right:24px;top:22px;width:34px;height:34px;border-radius:50%;
  background:#fbfcfd;border:1px solid #f0f2f5;display:flex;align-items:center;justify-content:center;
  color:var(--chu-2)}

/* vòng tài nguyên */
.ring4{position:absolute;top:64px;width:278px;text-align:center}
.ring4 .lab{position:absolute;left:0;top:122px;width:100%;display:flex;align-items:center;
  justify-content:center;gap:7px;font-size:13px;color:var(--chu-2)}
.ring4 .mid{position:absolute;left:0;top:44px;width:100%;text-align:center}
.ring4 .mid b{font-size:15px;font-weight:700}
.ring4 .mid i{font-style:normal;font-size:10px;color:var(--chu-nhat)}
.ring4 .mid s{display:block;text-decoration:none;font-size:10.5px;color:var(--chu-nhat);margin-top:2px}
.ring4 .dot{position:absolute;left:50%;top:100px;width:7px;height:7px;margin-left:-3.5px;
  border-radius:50%;background:#22c55e}

/* thẻ quảng cáo tên miền */
#promo{position:absolute;left:1172px;top:344px;width:388px;height:218px;border-radius:14px;
  background:linear-gradient(140deg,#f2954f,#e2530e 62%);overflow:hidden}
#promo .ic{position:absolute;left:24px;top:24px;width:38px;height:38px;border-radius:10px;
  background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center}
#promo .t{position:absolute;left:24px;top:78px;width:340px;font-size:14.5px;font-weight:700;color:#fff}
#promo .b{position:absolute;left:24px;top:102px;width:340px;font-size:12px;line-height:1.5;
  color:rgba(255,255,255,.92)}
#promo .btn{position:absolute;left:24px;top:162px;width:340px;height:40px;border-radius:9px;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.38);
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:13px;font-weight:600;color:#fff}

/* trạng thái rỗng */
.empty{position:absolute;left:0;width:100%;text-align:center;color:var(--chu-mo)}
#emptyBtn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 18px;border-radius:9px;
  background:#1f2430;color:#fff;font-size:12.5px;font-weight:600}

/* ----- màn Triển khai website ----- */
#stepper{position:absolute;right:0;top:86px;display:flex;align-items:flex-start;gap:0}
.st{width:130px;text-align:center;position:relative}
.st .c{width:30px;height:30px;border-radius:50%;margin:0 auto;display:flex;align-items:center;
  justify-content:center;font-size:13px;font-weight:700;background:#f1f3f6;color:#9aa3af}
.st.on .c{background:var(--cam);color:#fff;box-shadow:0 0 0 4px rgba(226,83,14,.14)}
.st.done .c{background:var(--cam);color:#fff}
.st .t{margin-top:9px;font-size:11.5px;color:var(--chu-mo)}
.st.on .t{color:var(--chu);font-weight:600}
.stLine{position:absolute;top:15px;height:2px;background:#e9ecf1}
.stLine.on{background:var(--cam)}

.tile{position:absolute;width:353px;height:66px;border:1px solid var(--vien);border-radius:12px;
  background:#fff}
.tile .ic{position:absolute;left:12px;top:12px;width:40px;height:40px;border-radius:10px;
  background:#f3f5f7;display:flex;align-items:center;justify-content:center;color:var(--chu-2)}
.tile .t{position:absolute;left:64px;top:14px;font-size:14px;font-weight:600}
.tile .d{position:absolute;left:64px;top:35px;width:275px;font-size:11.5px;color:var(--chu-mo);
  line-height:1.3}
.tile.on{border:1.6px solid var(--cam);background:var(--cam-mo)}
.tile.on .ic{background:#fbdfcd;color:var(--cam)}
/* dấu tích chỉ hiện ở thẻ đang chọn — mặc định phải tắt, không thì thẻ nào cũng có */
.tile .chk{position:absolute;right:10px;top:10px;width:19px;height:19px;border-radius:50%;opacity:0;
  background:var(--cam);display:flex;align-items:center;justify-content:center;will-change:transform,opacity}
.hr{position:absolute;height:1px;background:var(--vien-2)}

#gitInput{position:absolute;height:36px;border:1px solid var(--vien);border-radius:8px;
  display:flex;align-items:center;padding:0 14px;font-size:13px;color:var(--chu);
  font-family:'JetBrains Mono',monospace;background:#fff;white-space:nowrap;overflow:hidden}
#gitInput.on{border-color:var(--cam);box-shadow:0 0 0 3px rgba(226,83,14,.10)}
#gitPh{color:var(--chu-nhat)}
#caret{display:inline-block;width:1.4px;height:15px;background:var(--cam);margin-left:2px}
#btnCheck{position:absolute;height:36px;border:1px solid var(--vien);border-radius:8px;
  display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--chu-nhat)}
#btnCheck.on{border-color:#c7ebd3;background:#eaf7ee;color:var(--xanh);font-weight:600}
#btnNext{position:absolute;height:38px;width:112px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;gap:6px;font-size:13.5px;font-weight:600;
  background:#f8cfb6;color:#fff;will-change:transform}
#btnNext.on{background:linear-gradient(92deg,var(--cam-2),var(--cam));
  box-shadow:0 8px 18px rgba(226,83,14,.32)}

/* bảng tóm tắt bên phải */
.sumRow{position:absolute;left:22px;width:336px;display:flex;align-items:center;
  justify-content:space-between;font-size:12.5px}
.sumRow .l{display:flex;align-items:center;gap:8px;color:var(--chu-2)}
.sumRow .v{font-weight:600;color:var(--chu-nhat)}
.sumRow .v.hi{color:var(--cam)}
.box{position:absolute;left:22px;width:336px;border:1px solid var(--vien-2);border-radius:10px;
  background:#fbfcfd;padding:12px 14px}
.box .t{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;margin-bottom:6px}
.box .b{font-size:11.5px;line-height:1.5;color:var(--chu-mo)}
.box .li{display:flex;align-items:flex-start;gap:8px;font-size:11.5px;color:var(--chu-2);
  line-height:1.5;margin-top:5px}

/* ----- trang “đang triển khai” ----- */
.step{position:absolute;display:flex;gap:12px;align-items:flex-start}
.stepDot{width:18px;height:18px;border-radius:50%;border:2px solid #d6dae1;flex:none;margin-top:1px;
  display:flex;align-items:center;justify-content:center}
.stepDot.dang{border-color:var(--cam);border-right-color:transparent;will-change:transform}
.stepDot.xong{border-color:var(--xanh);background:var(--xanh)}
.stepDot.xong::after{content:'';width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;
  transform:rotate(-45deg) translate(1px,-1px)}
.stepT{font-size:14px;font-weight:600;line-height:1.25}
.stepS{font-size:12px;color:var(--chu-mo);margin-top:3px}
#chipRun{position:absolute;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:999px;
  background:#fff3ec;color:var(--cam);border:1px solid #fbd8c5}
#bar{position:absolute;height:7px;border-radius:999px;background:#edf0f4;overflow:hidden}
#barIn{position:absolute;left:0;top:0;bottom:0;border-radius:999px;
  background:linear-gradient(90deg,var(--cam-2),var(--cam))}
#pct{position:absolute;font-size:13px;font-weight:600;font-family:'Space Grotesk',sans-serif;text-align:right}
#log{position:absolute;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#7a8598;line-height:2}
#log div{white-space:nowrap;will-change:opacity,transform}

/* ----- trang “đã lên mạng” ----- */
#okCard{position:absolute;left:0;top:174px;width:1000px;height:290px}

const HOP={};
function hop(sel){
  if(HOP[sel])return HOP[sel];
  const r=$(sel).getBoundingClientRect(),a=app.getBoundingClientRect();
  const k=a.width/APP_W;
  return HOP[sel]={x:(r.left-a.left)/k,y:(r.top-a.top)/k,w:r.width/k,h:r.height/k};
}
const tam=s=>{const b=hop(s);return{u:(b.x+b.w/2)/APP_W,v:(b.y+b.h/2)/APP_H}};
function datVong(elm,sel,no=6){
  const b=hop(sel);
  elm.style.left=px(b.x-no);elm.style.top=px(b.y-no);
  elm.style.width=px(b.w+no*2);elm.style.height=px(b.h+no*2);
}
/* ben: 'phai' (cạnh phải, dx đẩy thêm để né thành phần bên cạnh) | 'tren' | 'duoi' */
function datNhan(elm,sel,txt,ben,dx=0){
  const b=hop(sel);elm.textContent=txt;
  if(ben==='phai'){elm.className='tag ben';elm.style.left=px(b.x+b.w+22+dx);elm.style.top=px(b.y+b.h/2-20)}
  else if(ben==='duoi'){elm.className='tag duoi';elm.style.left=px(b.x+8+dx);elm.style.top=px(b.y+b.h+16)}
  else{elm.className='tag';elm.style.left=px(b.x+8+dx);elm.style.top=px(b.y-54)}
}

function kbAnh(s,ix,iy){                       /* Ken Burns trên ảnh mockup */
  const gx=ix*KX, gy=iy*KY, bx=ST_W*(s-1)/2, by=ST_H*(s-1)/2;
  return{tx:cl(-s*(gx-ST_W/2),-bx,bx), ty:cl(-s*(gy-ST_H/2),-by,by)};
}
function kbApp_(s,ax,ay){                      /* máy quay trên giao diện thật */
  const p=appToStage(ax,ay);
  let tx=-s*(p.x-ST_W/2);
  if(s*WIN_W>=ST_W){                           /* không để lộ nền sau cửa sổ */
    const lo=ST_W-ST_W/2-s*(WIN_X+WIN_W-ST_W/2), hi=-ST_W/2-s*(WIN_X-ST_W/2);
    tx=cl(tx,lo,hi);
  }
  return{tx, ty:-s*(p.y-ST_H/2)};
}

  ck.style.opacity=chon?1:0;
  ck.style.transform='scale('+(chon?(0.4+0.6*seg(t,D.chon,D.chon+0.22,eBack)):0.4).toFixed(3)+')';
  $('#sumSrc').textContent=chon?'Tải file':'Chưa chọn';

  /* Gói .zip: nằm chờ → con trỏ cầm lấy → đi theo đúng con trỏ → buông vào ô thả.
     Tâm thẻ luôn bằng vị trí con trỏ trừ đi độ lệch tay cầm, nên hai thứ khớp nhau
     từng khung hình. */
  const hien=t>=D.hien-0.05&&t<D.bam+0.10;
  setO(E.tep,hien?seg(t,D.hien,D.hien+0.22,eOut):0);
  let tamX=NGHI.x, tamY=NGHI.y, dangCam=false;
  if(t>=D.cam&&t<D.tha){
    const q=troAt(t); tamX=q.x-TAY.x; tamY=q.y-TAY.y; dangCam=true;
  }else if(t>=D.tha){
    const k=seg(t,D.tha,D.tha+0.20,eOut);       /* buông ra thì hít vào giữa ô thả */
    const q=troAt(D.tha);
    tamX=lerp(q.x-TAY.x,THA.x,k); tamY=lerp(q.y-TAY.y,THA.y,k);
  }
  if(hien){
    const nang=dangCam?1.05:1, xoay=dangCam?-2.2:0;
    const nhun=1-0.05*pop(t,D.tha,D.tha+0.34,.10,.20);
    E.tep.style.transform='translate('+px(tamX-THA.x)+','+px(tamY-THA.y)+') rotate('
      +xoay+'deg) scale('+(nang*nhun).toFixed(3)+')';
    E.tep.style.boxShadow=dangCam?'0 26px 60px rgba(15,23,42,.34)':'0 16px 40px rgba(15,23,42,.18)';
    const okk=seg(t,D.tha+0.14,D.tha+0.44,eBack);
    setO(E.tep.querySelector('.ok'),okk);
    E.tep.querySelector('.ok').style.transform='scale('+(0.3+0.7*okk).toFixed(3)+')';
  }
  /* ô thả chỉ sáng khi tệp thật sự được kéo tới gần */
  E.tha.classList.toggle('hover', hien && tamY>430);
  const chuTha=1-seg(t,D.tha-0.30,D.tha,eIO);
  ['.ic','.t','.s'].forEach(q=>setO(E.tha.querySelector(q),chuTha));
  /* nhận tệp xong thì bảng tóm tắt bên phải điền vào, nút bật sáng */
  const xong=t>=D.tha+0.30;
  $('#sumName').textContent=xong?'vongquay-mayman':'Chưa đặt';
  $('#sumAddr').textContent=xong?URL_LIVE:'Chưa đặt';
  E.btn.classList.toggle('on',xong);
  E.btn.style.transform='scale('+(1-0.06*pop(t,D.bam,D.bam+0.18,.05,.10)).toFixed(3)+')';

  /* ba bước triển khai */
  if(t>=D.bam&&t<D.xong+0.4){
    const B=window.__BUOC;
    D.buoc.forEach(([a,b],i)=>{
      const d=$('#dot'+i), ss=$('#ss'+i);
      d.className='stepDot'+(t>=b?' xong':t>=a?' dang':'');
      d.style.transform=(t>=a&&t<b)?'rotate('+((t-a)*520).toFixed(0)+'deg)':'';
      const txt=t>=b?'Xong':t>=a?B[i][1]:'Chưa bắt đầu';
      if(ss.textContent!==txt)ss.textContent=txt;
    });
    const cur=D.buoc.findIndex(([a,b])=>t>=a&&t<b);
    setO($('#chipRun'),cur>=0?1:0);
    if(cur>=0)$('#chipRun').style.top=px(36+cur*62);
    const p=seg(t,D.buoc[0][0],D.buoc[2][1],eIO);
    $('#barIn').style.width=(p*100).toFixed(2)+'%';
    $('#pct').textContent=Math.round(p*100)+'%';
    [...$('#log').children].forEach((d,i)=>{
      const k=pop(t,D.buoc[0][0]+0.10+i*0.62,D.xong+0.30,.22,.12);
      setO(d,k*0.95); d.style.transform='translateX('+px((1-k)*10)+')';
    });
  }

  /* trang “đã lên mạng” */
  if(t>=D.xong-0.1){
    const k=seg(t,D.xong,D.xong+0.34,eOut);
    $('#okRing').style.transform='scale('+(0.5+0.5*seg(t,D.xong+0.02,D.xong+0.40,eBack)).toFixed(3)+')';
    const uk=seg(t,D.xong+0.26,D.xong+0.62,eOut);
    $('#okUrl').style.transform='translateY('+px((1-uk)*10)+')'; setO($('#okUrl'),uk);
    [...document.querySelectorAll('#okCard .meta')].forEach((m,j)=>{
      const q=seg(t,D.xong+0.40+j*0.10,D.xong+0.76+j*0.10,eOut);
      setO(m,q); m.style.transform='translateY('+px((1-q)*8)+')';
    });
    const bk=seg(t,D.xong+0.60,D.xong+0.90,eBack);
    setO($('#okBtn'),bk); $('#okBtn').style.transform='scale('+(0.9+0.1*bk).toFixed(3)+')';
  }

  /* vòng sáng chỉ vào đúng nút đang thao tác */
  const hien2=VONG_APP.map((v,j)=>[pop(t,v[0],v[1],.24,.28),j]).filter(x=>x[0]>0.002).slice(0,1);
  if(hien2.length){
    const [o,j]=hien2[0], v=VONG_APP[j];
    datVong(E.rA,v[2]); datNhan(E.tA,v[2],v[3],v[4],v[5]);
    setO(E.rA,o); setO(E.tA,o);
    const g=seg(t,v[0],v[0]+0.30,eBack), tho=1+0.010*Math.sin((t-v[0])*6);
    E.rA.style.transform='scale('+((1.10-0.10*g)*tho).toFixed(4)+')';
    E.tA.style.transform='translateY('+px((1-o)*-6)+') scale('+(0.94+0.06*o).toFixed(3)+')';
  }else{ setO(E.rA,0); setO(E.tA,0) }
  setO(E.rB,0); setO(E.tB,0);
}

/* ==========================================================================
   CHẠY / TUA
   ========================================================================== */
/* TOC: hệ số chạy nhanh/chậm, truyền qua địa chỉ `?toc=1.1`. Nhân vào ĐỒNG HỒ
   chứ không đụng gì tới render() — mọi mốc trong SC[], LOP[], D{} giữ nguyên số
   cũ, chỉ là đồng hồ chạy nhanh hơn. Nhờ vậy bộ xuất vẫn vẽ thật từng khung ở
   30 hình/giây; tăng tốc bằng cách bỏ bớt khung của bản đã xuất thì hình giật. */
const TOC=Math.max(0.25,Math.min(4,parseFloat(new URLSearchParams(location.search).get('toc'))||1));
let t=0,DUNG=true,last=0;
function loop(now){
  if(!DUNG){
    t+=Math.min(0.30,(now-last)/1000)*TOC;
    if(t>=DUR){t=DUR;DUNG=true;$('#btnPlay').textContent='▶ Chạy'}
    render(t);ui();
  }
  last=now;requestAnimationFrame(loop);
}
function ui(){$('#scrub').value=t.toFixed(2);
  $('#tnum').textContent=t.toFixed(2)+' / '+DUR.toFixed(2)+'s'}
$('#btnPlay').addEventListener('click',()=>{
  if(t>=DUR)t=0; DUNG=!DUNG; last=performance.now();
  $('#btnPlay').textContent=DUNG?'▶ Chạy':'❚❚ Dừng'});
$('#scrub').addEventListener('input',e=>{t=parseFloat(e.target.value);render(t);ui()});
[[0,'Hook'],[6,'Thu lead'],[11,'Kể AI'],[17,'AI dựng'],[22.5,'Deploy thật'],
 [26.4,'Kéo .zip'],[30.4,'Triển khai'],[35,'Lên mạng'],[38,'Dữ liệu+USP'],[47,'Kết']]
.forEach(([s,n])=>{const b=document.createElement('button');
  b.textContent=s+'s · '+n; b.onclick=()=>{t=s;render(t);ui()};$('#chaps').appendChild(b)});

function fit(){
  if(document.body.classList.contains('exporting')){$('#stage').style.transform='none';return}
  const k=Math.min((innerWidth-40)/ST_W,(innerHeight-150)/ST_H,1);
  $('#stage').style.transform='scale('+k+')';
  $('#stage').style.margin=((k-1)*ST_H/2)+'px '+((k-1)*ST_W/2)+'px';
}
addEventListener('resize',fit);
function khoiDong(){CUR=duongTro();render(0);ui()}

if(/[?&]export=1/.test(location.search)){
  document.body.classList.add('exporting');
  window.__clip={
    /* Bộ xuất tính mọi thứ theo giờ CỦA BẢN XUẤT, nên duration/at/seek phải quy
       đổi qua TOC; t bên trong vẫn là giờ của kịch bản. */
    duration:DUR/TOC,
    ready:async()=>{
      await napPhuDe();
      await document.fonts.ready;
      await Promise.all([...document.images].filter(i=>i.src).map(i=>i.decode().catch(()=>{})));
      fit();khoiDong();
    },
    play:()=>{DUNG=false;last=performance.now()},
    at:()=>t/TOC, seek:s=>{t=cl(s*TOC,0,DUR);render(t)}, step:s=>{t=cl(s*TOC,0,DUR);render(t)},
  };
}
fit();
napPhuDe().then(()=>document.fonts.ready).then(khoiDong);
requestAnimationFrame(loop);
})();
</script>
