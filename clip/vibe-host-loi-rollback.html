/* Mốc đặt theo ĐỘ DÀI THẬT của tiếng sau lượt sinh đầu, không đặt bằng cảm tính.
   Lượt đầu đặt bằng ước lượng 0,072 giây/ký tự thì hai câu bị bộ lồng tiếng ÉP
   ×1,18 cho vừa khe — mà ép quá 1,18 là tai nghe ra ngay giọng chạy, và một
   trong hai câu đó lại là câu trục của cả clip ("hỏng ở đâu, vì sao, nên sửa
   gì"). Giọng này đọc nhanh hơn ước lượng nhiều, thực đo ~0,055 giây/ký tự.
   Khe của MỌI câu bây giờ đều rộng hơn tiếng ít nhất 0,3 giây, không câu nào
   còn bị ép. Đổi chữ trong câu nào thì đo lại đúng câu đó rồi nắn mốc. */
const VO=[
  [ 0.60,'Không biết bạn đã gặp cảnh này chưa.'],
  [ 3.35,'Bên trên là máy của bạn, bên dưới là internet.'],
  [ 7.05,'Cùng một đoạn mã mà ra hai kết quả.'],
  [10.05,'Bạn hỏi vì sao, thì hệ thống trả lời bằng hai trăm dòng tiếng Anh.'],
  [15.10,'Bạn muốn biết nó nói gì?'],
  /* "đọc hộ" bị chép mù nghe thành "đọc HỌ" hai lượt liền, độ tin cậy -0,65 và
     -0,74 — thấp nhất cả bài. Đổi sang "đọc nhật ký giúp bạn": cùng nghĩa, bỏ
     hẳn chữ dễ nghe nhầm, mà lại kết vế bằng chữ dấu nặng đúng luật. */
  [17.85,'Bạn bấm một nút thôi, Vibe Host đọc nhật ký giúp bạn.'],
  /* Chép mù lượt đầu ra "HỒNG ở đâu" — đúng cái bẫy dấu hỏi thành dấu huyền, mà
     lại rơi vào cụm chữ trục của cả clip. Nguyên nhân: dấu hai chấm làm máy ngắt
     hẳn hơi, nên "hỏng" thành chữ ĐẦU CÂU rồi bị nuốt dấu. Thay hai chấm bằng
     dấu phẩy và chèn chữ "xem" phía trước là dấu bật đúng — cùng cách chữa đã
     dùng cho "Bấm"→"Bạn bấm" ở câu trên. */
  [22.45,'rồi nói lại bằng tiếng Việt, xem hỏng ở đâu, vì sao, nên sửa gì.'],
  [28.10,'Và đó là chỗ để bạn bắt đầu, chứ không phải chỗ để bỏ cuộc.'],
  [32.30,'Bạn cũng không phải dò cả trăm dòng để tìm chỗ hỏng.'],
  [36.20,'Hệ thống tô sáng ngay cái bước bị lỗi.'],
  [42.10,'Chưa sửa kịp thì sao?'],
  [44.10,'Bạn chọn phiên bản chạy được trước đó rồi bấm khôi phục.'],
  [49.60,'Vài giây sau là website chạy lại bình thường,'],
  [52.60,'còn bạn thì bình tĩnh xử lý sau.'],
  /* Chép mù lượt đầu ra "Chuyện LỜI thì ở đâu cũng có" — "lỗi" (ngã) nghe thành
     "lời" (huyền). Chỗ khác trong bài thì "lỗi" nghe đúng cả, nên vấn đề là cụm
     "chuyện lỗi" vốn không phải cách nói quen, không có gì đỡ cho cái dấu. Đổi
     sang "gặp lỗi" — cụm rất quen, và "lỗi" đứng cuối câu chứ không kẹt giữa. */
  [56.00,'Chạy website thì ở đâu cũng có lúc bị lỗi.'],
  [59.20,'Quan trọng là bạn có đường lùi hay không.'],
  [61.90,'Vibe Host lo phần đưa website lên mạng,'],
  [65.10,'để bạn cứ thoải mái sáng tạo.'],
];

/* ==========================================================================
   DỰNG CẢNH
   ========================================================================== */
/* Vài khung ngắm chạm mép ảnh, nên phần ngoài ảnh phải tô ĐÚNG màu nền tấm đó */
const NEN_TAM=['#fdfefe','#fefefe','#fdfdfd','#fdfdfd','#fefefe','#fdfdfd','#0d2113'];
const stage=$('#stage');
stage.style.width=ST_W+'px'; stage.style.height=ST_H+'px';

const truoc=$('#nen');
SC.forEach(s=>{
  const sc=el('div','sc'), kb=el('div','kb');
  const im=el('img'); im.src=MK+ANH[s.src]; im.alt='';
  im.style.width=NEN_W+'px'; im.style.height=NEN_H+'px';
  kb.appendChild(im); sc.appendChild(kb);
  sc.style.background=NEN_TAM[s.src];
  stage.insertBefore(sc,truoc);
  s.el=sc; s.kb=kb;
});

function datHop(e,box){
  const [x0,y0,x1,y1]=box;
  e.style.left=px(x0*KX); e.style.top=px(y0*KY);
  e.style.width=px((x1-x0)*KX); e.style.height=px((y1-y0)*KY);
}

/* Lớp nào khai `trong:1` thì gắn vào TRONG cái panel trượt gần nhất phía trên nó
   — và gắn vào tấm TRONG CÙNG (`ruot`), tức là trượt cùng panel chứ không đứng
   yên. Đứng yên thì suốt 0,8 giây panel còn đang trượt, nội dung lệch sang phải
   70 điểm ảnh mà miếng phủ vẫn nằm chỗ cũ, hở ra một dải. */
let noiTruot=null;
LOP.forEach(L=>{
  if(L.k==='truot'){
    const w=el('div','truot'); datHop(w,L.box);
    const ruot=el('div'); ruot.style.cssText='position:absolute;inset:0;will-change:transform';
    const im=el('img'); im.src=MK+ANH[SC[L.sc].src]; im.alt='';
    im.style.width=NEN_W+'px'; im.style.height=NEN_H+'px';
    im.style.position='absolute';
    im.style.left=px(-L.box[0]*KX); im.style.top=px(-L.box[1]*KY);
    ruot.appendChild(im); w.appendChild(ruot); SC[L.sc].kb.appendChild(w);
    L.el=w; L.im=ruot; noiTruot=L; return;
  }
  const cha=(L.trong&&noiTruot)?noiTruot:null;
  if(L.k==='vong'){
    const e=el('div','vong'); datHop(e,L.box);
    if(cha){ e.style.left=px((L.box[0]-cha.box[0])*KX); e.style.top=px((L.box[1]-cha.box[1])*KY) }
    const m=L.mau||'#f25c05';
    e.style.border='3px solid '+m;
    e.style.boxShadow='0 0 0 4px '+m+'29, 0 10px 34px '+m+'38';
    (cha?cha.im:SC[L.sc].kb).appendChild(e); L.el=e; return;
  }
  const e=el('div','che'); datHop(e,L.box);
  if(cha){ e.style.left=px((L.box[0]-cha.box[0])*KX); e.style.top=px((L.box[1]-cha.box[1])*KY) }
  e.style.background=L.mau;
  if(L.r) e.style.borderRadius=L.r;
  if(L.k==='che') e.style.transformOrigin='right center';
  if(L.k==='cheD') e.style.transformOrigin='center bottom';
  if(L.text){
    const s=el('span',null,L.text);
    s.style.cssText='display:block;font-size:'+(L.fs*KY).toFixed(2)+'px;'+(L.css||'');
    e.appendChild(s);
  }
  (cha?cha.im:SC[L.sc].kb).appendChild(e); L.el=e;
});

HAO.forEach(H=>{ const e=el('div','glow'); SC[H.sc].kb.appendChild(e); H.el=e });

/* con trỏ + gợn sóng: mỗi cảnh có con trỏ thì dựng riêng một bộ */
const MUI='<svg width="30" height="38" viewBox="0 0 30 38"><path d="M3 2l21 20-9 1.4 5 10.6-4.6 2.2-5-10.7L3 32z" '
  +'fill="#fff" stroke="#0f1722" stroke-width="2.2" stroke-linejoin="round"/></svg>';
CON.forEach(C=>{
  const e=el('div',null,MUI); e.id=''; e.className='tro';
  e.style.cssText='position:absolute;width:0;height:0;pointer-events:none;z-index:9;'
    +'will-change:transform,opacity';
  SC[C.sc].kb.appendChild(e); C.el=e;
  C.song=C.bam.map(()=>{
    const s=el('div','song'); SC[C.sc].kb.appendChild(s); return s;
  });
});

/* ==========================================================================
   MÁY QUAY — nhận khung ngắm theo toạ độ ảnh, tự tính phóng và dời
   ========================================================================== */
function ngam(v){
  const [x0,y0,x1,y1]=v;
  const w=(x1-x0)*KX, h=(y1-y0)*KY;
  const s=Math.min(ST_W/w, ST_H/h);
  const cx=(x0+x1)/2*KX, cy=(y0+y1)/2*KY;
  return {s, tx:ST_W/2-s*cx, ty:ST_H/2-s*cy};
}
const trung=(a,b,k)=>[lerp(a[0],b[0],k),lerp(a[1],b[1],k),lerp(a[2],b[2],k),lerp(a[3],b[3],k)];
function duong(kf,t){
  if(t<=kf[0][0])return kf[0][1];
  for(let i=0;i<kf.length-1;i++){
    if(t<=kf[i+1][0]) return trung(kf[i][1],kf[i+1][1],eIO(tt(t,kf[i][0],kf[i+1][0])));
  }
  return kf[kf.length-1][1];
}
function diem(kf,t){          /* đường đi của con trỏ: [giây,x,y] */
  if(t<=kf[0][0])return [kf[0][1],kf[0][2]];
  for(let i=0;i<kf.length-1;i++){
    if(t<=kf[i+1][0]){
      const q=eIO(tt(t,kf[i][0],kf[i+1][0]));
      return [lerp(kf[i][1],kf[i+1][1],q), lerp(kf[i][2],kf[i+1][2],q)];
    }
  }
  const l=kf[kf.length-1]; return [l[1],l[2]];
}

/* ==========================================================================
   PHỤ ĐỀ — mốc lấy từ vị trí thật của tiếng, do bộ lồng tiếng ghi ra
   ========================================================================== */
let PD=VO.map((v,i,a)=>({tu:v[0], den:(a[i+1]?a[i+1][0]:DUR)-0.05, loi:v[1]}));
async function napPhuDe(){
  try{
    const r=await fetch('out/voiceover/phu-de-vibe-host-loi-rollback.json',{cache:'no-store'});
    if(r.ok){const j=await r.json(); if(Array.isArray(j)&&j.length)PD=j}
  }catch(e){}
}
let pdI=-1;

const E={nen:$('#nen'),khoi:$('#khoi'),gach:$('#gach'),c1:$('#c1'),c2:$('#c2'),pd:$('#pd')};
let chuI=-1;
const HOA=0.42;

function render(t){
  SC.forEach((s,i)=>{
    const vao=seg(t,s.a-(i?HOA:0),s.a-(i?HOA:0)+HOA,eIO);
    const ra=i===SC.length-1?0:seg(t,s.b-HOA,s.b,eIO);
    const o=i===0?1-ra:vao*(1-ra);
    setO(s.el,o);
    if(o<0.002)return;
    const c=ngam(duong(s.vk,t));
    s.kb.style.transform='translate('+px(c.tx)+','+px(c.ty)+') scale('+c.s.toFixed(4)+')';
  });

  LOP.forEach(L=>{
    if(L.k==='che'){
      const q=1-tt(t,L.a,L.b);
      L.el.style.transform='scaleX('+q.toFixed(4)+')';
      setO(L.el, t>L.b+0.25?0:1);
      return;
    }
    if(L.k==='cheD'){
      const q=1-tt(t,L.a,L.b);
      L.el.style.transform='scaleY('+q.toFixed(4)+')';
      setO(L.el, t>L.b+0.25?0:1);
      return;
    }
    if(L.k==='truot'){
      const q=seg(t,L.a,L.b,eOut);
      L.im.style.transform='translateX('+px(L.dx*KX*(1-q))+')';
      setO(L.el,q);
      return;
    }
    if(L.k==='hien'){ setO(L.el, pop(t,L.a,L.b,.30,.34)); return }
    if(L.k==='mo'){
      const o=L.o!=null?L.o:1;
      setO(L.el, o*(t<L.a?1:(t>L.b?0:1-eIO(tt(t,L.a,L.b)))));
      return;
    }
    setO(L.el, pop(t,L.a,L.b,.26,.30));       /* vong */
  });

  HAO.forEach(H=>{
    const q=seg(t,H.a,H.b,eOut);
    setO(H.el,q);
    H.el.style.transform='scale('+(0.72+0.28*q).toFixed(3)+')';
  });

  CON.forEach(C=>{
    const hien=pop(t,C.a,C.b,.22,.26);
    setO(C.el,hien);
    if(hien>0.002){
      const [x,y]=diem(C.kf,t);
      C.el.style.transform='translate('+px(x*KX)+','+px(y*KY)+')';
    }
    C.bam.forEach((tb,k)=>{
      const q=tt(t,tb,tb+0.55);
      const s=C.song[k];
      if(t<tb-0.01||q>=1){ setO(s,0); return }
      const [x,y]=diem(C.kf,tb);
      const r=14+46*eOut(q);
      s.style.left=px(x*KX-r); s.style.top=px(y*KY-r);
      s.style.width=px(r*2); s.style.height=px(r*2);
      setO(s,(1-q)*0.85);
    });
  });

  let ci=-1;
  TXT.forEach((x,i)=>{ if(t>=x.a-0.12 && t<=x.b+0.12) ci=i });
  if(ci!==chuI){ chuI=ci; if(ci>=0){
    E.c1.innerHTML=TXT[ci].c1; E.c2.innerHTML=TXT[ci].c2;
    E.khoi.classList.toggle('toi',!!TXT[ci].toi);
    E.nen.classList.toggle('toi',!!TXT[ci].toi);
  } }
  if(ci<0){ setO(E.khoi,0); setO(E.nen,0) }
  else{
    const {a,b}=TXT[ci];
    const v=seg(t,a,a+0.42,eOut), r=seg(t,b-0.34,b,eIn);
    const o=v*(1-r);
    setO(E.khoi,o); setO(E.nen,o*0.98);
    E.gach.style.transform='scaleX('+seg(t,a,a+0.5,eOut).toFixed(3)+')';
    E.gach.style.transformOrigin='left center';
    E.c1.style.transform='translateY('+px((1-v)*26+r*-12)+')';
    E.c2.style.transform='translateY('+px((1-seg(t,a+0.10,a+0.62,eOut))*20+r*-9)+')';
  }

  {
    const i=PD.findIndex(c=>t>=c.tu-0.12 && t<=c.den+0.18);
    if(i!==pdI){ pdI=i; if(i>=0)E.pd.firstElementChild.innerHTML=PD[i].loi }
    setO(E.pd, i<0?0:pop(t,PD[i].tu-0.12,PD[i].den+0.18,.14,.16));
  }
}

/* ==========================================================================
   CHẠY / TUA
   ========================================================================== */
const TOC=Math.max(0.25,Math.min(4,parseFloat(new URLSearchParams(location.search).get('toc'))||1));
let t=0,DUNG=true,last=0;
function loop(now){
  if(!DUNG){
    t+=Math.min(0.30,(now-last)/1000)*TOC;
    if(t>=DUR){t=DUR;DUNG=true;$('#btnPlay').textContent='▶ Chạy'}
    render(t);ui();
  }
  last=now;requestAnimationFrame(loop);
}
function ui(){$('#scrub').value=t.toFixed(2);
  $('#tnum').textContent=t.toFixed(2)+' / '+DUR.toFixed(2)+'s'}
$('#btnPlay').addEventListener('click',()=>{
  if(t>=DUR)t=0; DUNG=!DUNG; last=performance.now();
  $('#btnPlay').textContent=DUNG?'▶ Chạy':'❚❚ Dừng'});
$('#scrub').addEventListener('input',e=>{t=parseFloat(e.target.value);render(t);ui()});
$('#scrub').max=DUR;
SC.forEach(s=>{const b=document.createElement('button');
  b.textContent=s.a+'s · '+s.ten; b.onclick=()=>{t=s.a;render(t);ui()};$('#chaps').appendChild(b)});

function fit(){
  if(document.body.classList.contains('exporting')){$('#stage').style.transform='none';return}
  const k=Math.min((innerWidth-40)/ST_W,(innerHeight-160)/ST_H,1);
  $('#stage').style.transform='scale('+k+')';
  $('#stage').style.margin='0 0 '+((k-1)*ST_H)+'px';
}
addEventListener('resize',fit);
function khoiDong(){render(0);ui()}

if(/[?&]export=1/.test(location.search)){
  document.body.classList.add('exporting');
  window.__clip={
    duration:DUR/TOC,
    ready:async()=>{
      await napPhuDe();
      await document.fonts.ready;
      await Promise.all([...document.images].filter(i=>i.src).map(i=>i.decode().catch(()=>{})));
      await new Promise(r=>setTimeout(r,260));
      fit();khoiDong();
    },
    play:()=>{DUNG=false;last=performance.now()},
    at:()=>t/TOC, seek:s=>{t=cl(s*TOC,0,DUR);render(t)}, step:s=>{t=cl(s*TOC,0,DUR);render(t)},
  };
}
fit();
napPhuDe().then(()=>document.fonts.ready).then(khoiDong);
requestAnimationFrame(loop);
})();
</script>
