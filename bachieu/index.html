<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xưởng 3D — Motion</title>
<style>
  :root{
    --nen:#101216; --san:#3d4046; --tam:#191c22; --vien:#2b303a; --chu:#e8ecf3;
    --mo:#8b95a8; --nhan:#FF7A2F; --chon:#31d975;
    --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--nen);color:var(--chu);font-family:var(--font);
    display:grid;grid-template-columns:1fr 322px;overflow:hidden}
  @media (max-width:860px){body{grid-template-columns:1fr;grid-template-rows:1fr auto;overflow:auto;height:auto}}

  /* ---------- bên trái ---------- */
  .trai{display:flex;flex-direction:column;min-width:0;min-height:0}
  .dinh{display:flex;align-items:center;gap:12px;padding:11px 18px;
    border-bottom:1px solid var(--vien);flex:none}
  .dinh a.ve{color:var(--mo);text-decoration:none;font-size:13px;padding:6px 11px;
    border:1px solid var(--vien);border-radius:8px;white-space:nowrap}
  .dinh a.ve:hover{color:var(--chu);border-color:var(--nhan)}
  .dinh h1{font-size:15px;margin:0;font-weight:700;letter-spacing:-.01em}
  .dinh .phu{font-size:11.5px;color:var(--mo)}
  .dinh .day{margin-left:auto;display:flex;gap:7px;align-items:center}
  .nut{background:var(--tam);border:1px solid var(--vien);color:var(--chu);
    border-radius:8px;padding:7px 13px;font:inherit;font-size:12.5px;cursor:pointer}
  .nut:hover{border-color:var(--nhan)}
  .nut.chinh{background:var(--nhan);border-color:var(--nhan);color:#1a0f06;font-weight:700}

  /* KHUNG NHÌN — không khung phim nào gò, đây là chỗ anh Quý yêu cầu đổi */
  /* NỀN XÁM TRUNG TÍNH, không phải đen.
     Nền gần đen thì vật tối (áo choàng, giày đen) chìm mất và lưới không đọc
     được — anh Quý gặp đúng chuyện này. Blender cố ý để xám trung tính vì mắt
     cần một mức sáng ở GIỮA để so: nền đen thì chỉ thấy được vật sáng, nền
     trắng thì chỉ thấy được vật tối.
     Chuyển sắc nhẹ từ trên xuống cho ra chiều sâu, không để phẳng lì. */
  #san{flex:1;position:relative;min-height:380px;overflow:hidden;cursor:grab;
    background:linear-gradient(180deg,#4a4e55 0%,#3d4046 46%,#303338 100%);
    touch-action:none}
  #san.dangkeo{cursor:grabbing}
  /* SÀN nằm TRONG cảnh nên xoay theo máy quay — cho mắt bám vào mà biết mình
     đang đứng đâu. Vẽ bằng hình nền của khung nhìn thì nó đứng im lúc xoay, và
     phá luôn ảo giác ba chiều. */
  /* LƯỚI HAI CẤP như Blender: ô nhỏ 120, ô lớn 600. Một cấp thôi thì lúc thu
     nhỏ các vạch dính thành một mảng xám, lúc phóng to lại thưa đến mức mất
     cảm giác khoảng cách. */
  .bc-san{position:absolute;left:50%;top:50%;width:6000px;height:6000px;
    margin:-3000px 0 0 -3000px;pointer-events:none;
    /* Vạch TỐI HƠN nền, không sáng hơn. Trên nền xám thì vạch trắng mờ gần như
       biến mất, còn vạch tối thì đọc được ngay — đây đúng là cách Blender vẽ.
       Vạch sáng chỉ hợp với nền đen, mà nền đen thì đã bỏ. */
    background-image:
      linear-gradient(rgba(0,0,0,.16) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,.16) 1px, transparent 1px),
      linear-gradient(rgba(0,0,0,.30) 2px, transparent 2px),
      linear-gradient(90deg, rgba(0,0,0,.30) 2px, transparent 2px);
    background-size:120px 120px, 120px 120px, 600px 600px, 600px 600px;
    -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 14%, transparent 48%);
            mask-image:radial-gradient(circle at 50% 50%, #000 18%, transparent 54%)}
  /* HAI TRỤC có màu, cũng theo Blender: đỏ chạy ngang, xanh lá chạy vào sâu.
     Không có chúng thì lưới đối xứng hoàn toàn và xoay máy một lúc là mất
     phương hướng, không biết mình đang nhìn từ phía nào. */
  .bc-truc{position:absolute;left:50%;top:50%;pointer-events:none}
  .bc-truc-ngang{width:6000px;height:2.5px;margin:-1.25px 0 0 -3000px;
    background:linear-gradient(90deg,transparent,rgba(190,62,62,.85) 22%,rgba(190,62,62,.85) 78%,transparent)}
  .bc-truc-sau{width:2.5px;height:6000px;margin:-3000px 0 0 -1.25px;
    background:linear-gradient(180deg,transparent,rgba(86,150,62,.85) 22%,rgba(86,150,62,.85) 78%,transparent)}
  /* BÓNG ĐỔ dưới chân mỗi món. Không có nó thì vật lơ lửng, mắt không đoán
     được nó đứng ở đâu trên sàn — đây là thứ làm cảnh "có thật" nhiều nhất,
     mà rẻ hơn tính bóng thật cả ngàn lần. */
  .bc-bong{position:absolute;left:50%;top:50%;pointer-events:none;border-radius:50%}
  #goc-may{position:absolute;left:14px;bottom:12px;font-size:11px;color:rgba(255,255,255,.52);
    font-variant-numeric:tabular-nums;pointer-events:none}
  #chi-dan{position:absolute;right:14px;bottom:12px;font-size:11px;color:rgba(255,255,255,.52);pointer-events:none}
  /* Ô báo tiến trình. Gọi AI kèm ảnh mất 30–120 giây; không có cái này thì
     người dùng bấm xong thấy màn hình đứng im và tưởng app treo, rồi bấm lại —
     mỗi lần bấm là một lượt AI bị tính tiền. */
  #dang-bay{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:12px;z-index:25;
    background:rgba(20,23,28,.82);backdrop-filter:blur(2px);color:var(--chu)}
  #dang-bay[hidden]{display:none}
  #dang-bay b{font-size:14px;font-weight:600}
  #dang-bay span{font-size:12px;color:var(--mo);font-variant-numeric:tabular-nums}
  #dang-bay .vong{width:34px;height:34px;border-radius:50%;
    border:3px solid rgba(255,255,255,.14);border-top-color:var(--nhan);
    animation:quay 0.9s linear infinite}
  @keyframes quay{to{transform:rotate(360deg)}}

  /* ---------- khối ---------- */
  .bc-may{transform-style:preserve-3d;position:absolute;left:50%;top:50%;will-change:transform}
  .bc-cho{transform-style:preserve-3d;position:absolute;left:0;top:0}
  .bc-goc{transform-style:preserve-3d;position:relative;will-change:transform}
  .bc-hop{transform-style:preserve-3d;position:absolute;left:0;top:0}
  .bc-mat{position:absolute;left:0;top:0;backface-visibility:hidden;
    display:grid;place-items:center;border-radius:2px}
  /* Quả cầu MƯỢT: một đĩa tròn tô chuyển sắc, thay cho cả trăm mảnh phẳng. */
  .bc-cau{position:absolute;left:0;top:0;border-radius:50%;backface-visibility:visible}
  .bc-chu{font-weight:800;letter-spacing:-.02em;color:rgba(0,0,0,.55);user-select:none}
  .bc-lop{position:absolute;left:50%;top:50%;transform-origin:50% 50%;
    font-weight:900;letter-spacing:-.03em;white-space:nowrap;user-select:none;line-height:1}
  .bc-cho.chon .bc-mat{outline:1px solid rgba(49,217,117,.55);outline-offset:-1px}
  /* KHUNG CHỌN + NÚM NẮM.
     Vì sao cần: con linh vật là 60 mảnh rời, bấm vào khe giữa hai mảnh là trúng
     nền. Viền mảnh ở trên chỉ vẽ được trên MẶT PHẲNG — quả cầu mượt không có
     mặt nào nên món tròn gần như không thấy mình đang được chọn. Khung phẳng
     này luôn thấy, và cái núm ở giữa thì LÚC NÀO CŨNG bấm trúng. */
  #nam{position:absolute;inset:0;pointer-events:none;z-index:4}
  #khung-nam{position:absolute;left:0;top:0;box-sizing:border-box;
    border:1px dashed rgba(49,217,117,.5);border-radius:3px;
    background:rgba(49,217,117,.05)}
  /* Bốn góc đậm hơn — mắt bắt góc nhanh hơn bắt cạnh, và nét đứt mảnh thì trên
     nền xám dễ chìm. */
  #khung-nam::before,#khung-nam::after{content:'';position:absolute;
    width:13px;height:13px;border:2px solid #31d975}
  #khung-nam::before{left:-1px;top:-1px;border-right:0;border-bottom:0;border-radius:3px 0 0 0}
  #khung-nam::after{right:-1px;bottom:-1px;border-left:0;border-top:0;border-radius:0 0 3px 0}
  /* Núm là một VÒNG có dấu bốn chiều, không phải chấm đặc. Chấm xanh đặc rơi
     đúng lên huy hiệu ngực của linh vật — cũng một chấm xanh — và không ai
     phân biệt được đâu là nút đâu là hình. Vòng rỗng kèm dấu mũi tên thì đọc
     ra ngay là thứ để bấm. */
  #num-nam{position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;
    pointer-events:auto;cursor:move;box-sizing:border-box;
    border:2px solid #31d975;background:rgba(14,17,22,.62);
    box-shadow:0 0 0 1.5px rgba(10,12,16,.6),0 2px 8px rgba(0,0,0,.5)}
  /* Dấu bốn chiều vẽ bằng hai vạch bắt chéo — rẻ hơn nhét một hình SVG vào. */
  #num-nam::before,#num-nam::after{content:'';position:absolute;background:#31d975;
    left:50%;top:50%;transform:translate(-50%,-50%);border-radius:1px}
  #num-nam::before{width:13px;height:2px}
  #num-nam::after{width:2px;height:13px}
  #num-nam:hover{background:rgba(49,217,117,.3);border-color:#6bffab}
  #san.dangkeo #num-nam{cursor:grabbing}

  /* ---------- bên phải ---------- */
  .phai{border-left:1px solid var(--vien);display:flex;flex-direction:column;min-height:0}
  @media (max-width:860px){.phai{border-left:0;border-top:1px solid var(--vien)}}
  .khoi-ds{flex:none;max-height:38vh;overflow-y:auto;border-bottom:1px solid var(--vien);padding:11px}
  .khoi-bang{flex:1;overflow-y:auto;padding:13px 13px 40px}
  h2{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mo);
    margin:0 0 8px;font-weight:700}
  .muc{margin-bottom:17px}
  .mon-hang{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;
    cursor:pointer;font-size:13px}
  .mon-hang:hover{background:var(--tam)}
  .mon-hang[aria-selected=true]{background:rgba(49,217,117,.12);
    box-shadow:inset 0 0 0 1px rgba(49,217,117,.45)}
  .mon-hang .cham{width:11px;height:11px;border-radius:3px;flex:none}
  .mon-hang .ten{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mon-hang button{background:none;border:0;color:var(--mo);cursor:pointer;
    font:inherit;font-size:12px;padding:2px 5px;border-radius:5px}
  .mon-hang button:hover{color:var(--chu);background:var(--vien)}
  .o{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:8px}
  .o label{font-size:12.5px}
  .o .goi{font-size:11px;color:var(--mo);display:block;margin-top:1px}
  .o input[type=range]{width:132px;accent-color:var(--nhan)}
  select,input[type=text],input[type=number]{background:var(--tam);border:1px solid var(--vien);
    color:var(--chu);border-radius:7px;padding:6px 9px;font:inherit;font-size:12.5px}
  select{width:100%}
  .ba-o{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .ba-o input{width:100%}
  .ba-o span{font-size:10.5px;color:var(--mo);text-align:center;display:block;margin-bottom:3px}
  .mau-day{display:flex;gap:7px;flex-wrap:wrap}
  .mau-day button{width:32px;height:32px;border-radius:9px;border:2px solid var(--vien);cursor:pointer;padding:0}
  .mau-day button[aria-pressed=true]{border-color:var(--chu)}
  .trong{color:var(--mo);font-size:12px;line-height:1.5}

  /* ---------- bàn đèn ---------- */
  .den-boc{position:relative;margin-bottom:9px}
  .den-nut{display:flex;align-items:center;gap:10px;width:100%;background:var(--tam);
    border:1px solid var(--vien);color:var(--chu);border-radius:9px;padding:8px 11px;
    font:inherit;font-size:12.5px;cursor:pointer;text-align:left}
  .den-nut:hover,.den-boc.mo .den-nut{border-color:var(--nhan)}
  .den-xem{width:25px;height:25px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
  .den-ta{color:var(--mo)}
  .den-bang{display:none;position:absolute;z-index:30;top:calc(100% + 7px);left:0;right:0;
    background:var(--tam);border:1px solid var(--nhan);border-radius:12px;padding:13px;
    box-shadow:0 16px 44px rgba(0,0,0,.6)}
  .den-boc.mo .den-bang{display:block}
  .den-ban{position:relative;width:168px;height:168px;margin:0 auto;border-radius:50%;
    background:
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.055), transparent 72%),
      repeating-conic-gradient(from 0deg, rgba(255,255,255,.028) 0deg 3deg, transparent 3deg 15deg);
    border:1px dashed var(--vien);cursor:grab;touch-action:none}
  .den-cau{position:absolute;left:50%;top:50%;width:88px;height:88px;margin:-44px 0 0 -44px;
    border-radius:50%;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
  .den-tay{position:absolute;width:25px;height:25px;margin:-12px 0 0 -12px;border-radius:50%;
    border:2px solid #fff;background:#ffe9b8;cursor:grab;padding:0;
    box-shadow:0 0 0 4px rgba(255,233,184,.22), 0 0 18px 4px rgba(255,210,120,.6)}
  .den-ghi{color:var(--mo);font-size:11px;text-align:center;margin-top:10px;line-height:1.5}
</style>
</head>
<body>
  <div class="trai">
    <div class="dinh">
      <a class="ve" href="/" title="Về trang chính Motion">← Motion</a>
      <div>
        <h1>Xưởng 3D</h1>
        <div class="phu">Dựng cảnh ba chiều — không mượn thư viện nào</div>
      </div>
      <div class="day">
        <select id="chon-loai" style="width:auto"></select>
        <button id="them" class="nut chinh" type="button">+ Thêm món</button>
        <button id="vua-khung" class="nut" type="button">Vừa khung</button>
        <button id="tu-anh" class="nut" type="button" title="Đưa một ảnh mẫu vào, AI bày sẵn bối cảnh">Bày từ ảnh…</button>
        <input id="tep-anh" type="file" accept="image/png,image/jpeg,image/webp" hidden>
      </div>
    </div>

    <div id="san">
      <!-- Chỗ vẽ cảnh phải là thẻ RIÊNG, không vẽ thẳng vào #san: phần dựng
           xoá sạch nội dung chỗ vẽ mỗi lần dựng lại, mà lưới sàn với dòng chỉ
           số máy quay cũng là con của #san — vẽ thẳng vào đó là xoá luôn
           chúng, và trang chết ngay từ lần dựng đầu tiên. -->
      <div id="canh3d" style="position:absolute;inset:0;transform-style:preserve-3d;perspective:2200px"></div>
      <!-- LỚP NẮM: khung chọn và núm nắm. Nằm NGOÀI cảnh 3D, vẽ bằng toạ độ
           phẳng đã chiếu sẵn — nhét vào trong cảnh thì nó bị xoay nghiêng theo
           máy quay, và một cái khung nghiêng thì chẳng chỉ ra được cái gì. -->
      <div id="nam" hidden>
        <div id="khung-nam"></div>
        <div id="num-nam" title="Nắm đây để dời món (giữ Shift để nâng hạ)"></div>
      </div>
      <div id="goc-may"></div>
      <div id="dang-bay" hidden>
        <div class="vong"></div>
        <b id="dang-bay-chu">Đang nhìn ảnh…</b>
        <span id="dang-bay-giay"></span>
      </div>
      <div id="chi-dan">kéo vật hoặc núm xanh để dời · giữ Shift để nâng hạ · kéo nền để xoay máy (chuột phải ở đâu cũng xoay) · lăn để phóng</div>
    </div>

  </div>

  <div class="phai">
    <div class="khoi-ds">
      <h2>Món trong cảnh</h2>
      <div id="ds-mon"></div>
    </div>
    <div class="khoi-bang" id="bang"></div>
  </div>

  <script type="module" src="./giaodien.js"></script>
</body>
</html>
