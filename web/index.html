<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sửa clip — Mắt Bão</title>
  <link rel="icon" type="image/png" href="/logo/favicon.png">
<!-- Bộ chữ TỰ CHỨA trong dự án — không tải gì qua mạng. Rút mạng vẫn đúng mặt
     chữ. File nằm bên dự án clip để `scene-player.html` dùng chung một bản,
     không phải hai bản sẽ trôi khỏi nhau. -->
<link rel="stylesheet" href="/clip/public/fonts/chu.css">
<link rel="stylesheet" href="/app.css">

<div id="app">
  <header class="thanh-tren">
    <!-- Dấu M là ẢNH, chữ "Motion" là CHỮ THẬT. Nhúng cả chữ vào ảnh thì nó mờ
         khi phóng to, và không đổi màu theo nền được — chữ trong file logo gốc là
         xanh navy đậm, đặt lên giao diện tối gần như mất hút. -->
    <img class="o-hieu" src="/logo/motion-mark.png" alt="" aria-hidden="true" width="28" height="15">
    <div class="hieu"><b>Motion</b> · Sửa clip</div>
    <select id="chon-clip" class="chon" aria-label="Chọn clip"></select>
    <span id="dau-ban" class="dau-ban an">chưa lưu</span>

    <div class="day"></div>

    <span id="dang-clip" class="chip-tin"></span>
    <!-- Chỗ cho lời nhắc "chưa đặt mật khẩu" và nút Thoát. Ở THANH TRÊN chứ
         không phải thanh dưới: thanh dưới là điều khiển phát phim. -->
    <span id="o-tai-khoan" class="o-tai-khoan"></span>

    <span class="nhom-nut">
      <button id="nut-lui" class="nut-tron" type="button" title="Hoàn tác (Ctrl+Z)" aria-label="Hoàn tác"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4L2.5 7.5 6 11"/><path d="M2.5 7.5h7a4 4 0 0 1 0 8H8"/></svg></button>
      <button id="nut-toi" class="nut-tron" type="button" title="Làm lại (Ctrl+Shift+Z)" aria-label="Làm lại"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 4l3.5 3.5L10 11"/><path d="M13.5 7.5h-7a4 4 0 0 0 0 8H8"/></svg></button>
    </span>
    <button id="nut-luu" class="nut chinh" type="button" title="Ctrl+S">Lưu</button>
  </header>

  <div class="than">
    <aside class="cot-trai">
      <div class="tieu-de-cot">
        Các cảnh
        <span class="cot-nut">
          <button id="canh-them" class="nut-ti" type="button" title="Thêm cảnh mới"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"/></svg></button>
          <button id="canh-nhan" class="nut-ti" type="button" title="Nhân bản cảnh này"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 5.5v-2a1.5 1.5 0 0 0-1.5-1.5H4a1.5 1.5 0 0 0-1.5 1.5V9A1.5 1.5 0 0 0 4 10.5h2"/></svg></button>
          <button id="canh-xoa" class="nut-ti" type="button" title="Xoá cảnh này"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
        </span>
      </div>
      <ol id="ds-canh" class="ds-canh"></ol>

      <div class="tieu-de-cot">
        Thành phần trong cảnh
        <span class="cot-nut">
          <button id="mon-them" class="nut-ti" type="button" title="Thêm thành phần"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"/></svg></button>
          <button id="mon-nhan" class="nut-ti" type="button" title="Nhân bản thành phần đang chọn"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 5.5v-2a1.5 1.5 0 0 0-1.5-1.5H4a1.5 1.5 0 0 0-1.5 1.5V9A1.5 1.5 0 0 0 4 10.5h2"/></svg></button>
          <button id="mon-xoa" class="nut-ti" type="button" title="Xoá thành phần đang chọn"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
        </span>
      </div>
      <!-- Lọc theo tên: một cảnh có tới 156 thành phần, cuộn tay là hết ngày. -->
      <div class="hop-tim">
        <svg class="tim-kinh" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
        <input id="tim-lop" class="nhap-tim" type="search" autocomplete="off"
               placeholder="Lọc thành phần…" aria-label="Lọc thành phần theo tên">
        <span id="tim-dem" class="tim-dem"></span>
      </div>
      <div id="ds-lop" class="ds-lop"></div>
      <div id="menu-them" class="menu-them an"></div>
    </aside>

    <!-- Tay nắm kéo đổi bề rộng cột. Nằm GIỮA hai cột chứ không nằm trong cột
         nào, để bấm trúng mà không phải đè lên nội dung. -->
    <div class="keo-cot" data-cot="trai"></div>

    <main class="giua">
      <div id="bang-doi-cu" class="bang-bao an">
        <b>Clip đời cũ.</b> Xem và xuất video được, nhưng chưa sửa trực tiếp được —
        clip này viết bằng code, vị trí do code tính lúc chạy.
      </div>

      <div id="san-khung" class="san-khau an"></div>
      <div id="san-video" class="san-khau an"></div>

      <div id="san-clip" class="san-khau">
        <div id="boc-khung" class="boc-khung">
          <iframe id="khung" title="Khung xem clip" referrerpolicy="no-referrer"></iframe>
          <!-- Lớp bắt sự kiện: iframe nuốt hết chuột nên trang cha phải phủ lên
               rồi tự dò xuống. Nằm khít iframe nên toạ độ khớp 1-1. -->
          <div id="lop-bat" class="lop-bat"></div>
          <!-- Lớp vẽ: chỉ để nhìn, không ăn chuột, KHÔNG BAO GIỜ chèn vào iframe. -->
          <div id="lop-phu" class="lop-phu"></div>
        </div>
      </div>

      <div id="chi-phong" class="chi-phong an">
        <span id="so-phong">100%</span>
        <button id="phong-lai" class="nut nho" type="button"
                title="Về 100% (Ctrl+0)">Vừa khung</button>
      </div>
    </main>

    <div class="keo-cot" data-cot="phai"></div>

    <aside class="cot-phai">
      <div class="the-hang" role="tablist">
        <button id="the-tt" class="the" type="button" role="tab" aria-selected="true">Thuộc tính</button>
        <button id="the-xuat" class="the" type="button" role="tab" aria-selected="false">Xuất video</button>
        <button id="the-khung" class="the an" type="button" role="tab" aria-selected="false">Khung nhấn</button>
        <button id="the-tieng" class="the" type="button" role="tab" aria-selected="false">Tiếng</button>
        <button id="the-video" class="the" type="button" role="tab" aria-selected="false">Video</button>
      </div>
      <div id="bang-thuoc-tinh" class="bang-tt"></div>
      <div id="bang-xuat" class="bang-tt an"></div>
      <div id="bang-khung" class="bang-tt an"></div>
      <div id="bang-tieng" class="bang-tt an"></div>
      <div id="bang-video" class="bang-tt an"></div>
    </aside>
  </div>

  <!-- Thanh phát dưới cùng: tên cảnh đang đứng · nút chạy · thanh tua · đồng hồ.
       Tách khỏi khung xem để lúc phóng to khung, chỗ điều khiển vẫn đứng yên. -->
  <footer class="thanh-duoi">
    <div class="dang-phat">
      <div id="anh-canh" class="anh-canh" aria-hidden="true"><svg viewBox="0 0 16 16"><rect x="1.5" y="3" width="13" height="10" rx="2"/><path d="M4.5 3v10M11.5 3v10"/></svg></div>
      <div class="dang-phat-chu">
        <span id="ten-canh" class="ten-canh">Chưa mở clip</span>
        <span id="phu-canh" class="phu-canh"></span>
      </div>
    </div>

    <div class="dieu-khien">
      <!-- Hình vẽ bằng SVG, nhưng chữ "Chạy"/"Dừng" vẫn nằm thật trong DOM cho
           trình đọc màn hình — và `kiem-chay-dung.mjs` đọc đúng chữ đó. -->
      <button id="nut-chay" class="nut-phat" type="button" data-chay="0" aria-label="Chạy">
        <svg class="hinh-chay" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.2l8 4.8-8 4.8z"/></svg>
        <svg class="hinh-dung" viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="3.4" width="3" height="9.2" rx="1"/><rect x="9" y="3.4" width="3" height="9.2" rx="1"/></svg>
        <span class="chay-nhan chi-doc">Chạy</span>
      </button>
      <input id="thanh-tua" class="thanh-tua" type="range" min="0" max="1000" value="0"
             step="1" aria-label="Tua clip">
      <span id="dong-ho" class="dong-ho">0,0 / 0,0 giây</span>
    </div>

    <div class="tien-ich-phai"></div>
  </footer>

  <div id="bao" class="bao an" role="status" aria-live="polite"></div>
</div>

<script type="module" src="/app.js"></script>
</html>
